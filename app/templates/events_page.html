<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50" x-data="eventsApp()" x-init="init()" x-cloak>

    <!-- Header — matches other pages -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <a href="/admin">
                    <img src="https://cdn.prod.website-files.com/681d81085457ff1ea60182c2/684103edf65163765f534531_PINES_LOGO_DARK.svg" alt="Pines" class="h-8">
                </a>
                <div class="flex items-center space-x-3">
                    <a href="/admin" class="text-gray-600 hover:text-gray-900 text-sm font-medium">Players</a>
                    <a href="/inventory" class="text-gray-600 hover:text-gray-900 text-sm font-medium">Inventory</a>
                    <span class="text-gray-900 text-sm font-medium">Events</span>
                    <button @click="syncEvents()" :disabled="syncing"
                            class="bg-pines-500 hover:bg-pines-600 disabled:opacity-50 text-white px-4 py-2 rounded-lg text-sm font-medium">
                        <span x-show="!syncing">Sync Events</span>
                        <span x-show="syncing">Syncing...</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="flex-1 min-w-64">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Search</label>
                    <input type="search" x-model="filters.search" @input.debounce.300ms="loadEvents()" placeholder="Name, description, or location..."
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 focus:border-transparent">
                </div>
                <div class="w-36 relative" x-data="{ open: false }">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Sport</label>
                    <button type="button" @click="open = !open" @click.outside="open = false"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-left bg-white flex items-center justify-between">
                        <span x-text="filters.sport || 'All'" :class="filters.sport ? 'text-gray-900' : 'text-gray-500'" class="truncate"></span>
                        <svg class="w-4 h-4 text-gray-400 flex-shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div x-show="open" x-transition class="absolute z-20 mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                        <div @click="filters.sport = ''; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-sm text-gray-500">All</div>
                        <template x-for="sp in availableSports" :key="sp">
                            <div @click="filters.sport = sp; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-sm"
                                 :class="filters.sport === sp ? 'bg-pines-50 text-pines-700 font-medium' : ''" x-text="sp"></div>
                        </template>
                    </div>
                </div>
                <div class="w-32 relative" x-data="{ open: false }">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Type</label>
                    <button type="button" @click="open = !open" @click.outside="open = false"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-left bg-white flex items-center justify-between">
                        <span x-text="filters.eventType ? typeLabel(filters.eventType) : 'All'" :class="filters.eventType ? 'text-gray-900' : 'text-gray-500'" class="truncate"></span>
                        <svg class="w-4 h-4 text-gray-400 flex-shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div x-show="open" x-transition class="absolute z-20 mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-lg">
                        <div @click="filters.eventType = ''; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-sm text-gray-500">All</div>
                        <template x-for="t in ['game', 'practice', 'event']" :key="t">
                            <div @click="filters.eventType = t; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-sm"
                                 :class="filters.eventType === t ? 'bg-pines-50 text-pines-700 font-medium' : ''">
                                <span x-text="typeLabel(t)"></span>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="w-36">
                    <label class="block text-xs font-medium text-gray-700 mb-1">From</label>
                    <input type="date" x-model="filters.startDate" @change="loadEvents()"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pines-500 focus:border-transparent">
                </div>
                <div class="w-36">
                    <label class="block text-xs font-medium text-gray-700 mb-1">To</label>
                    <input type="date" x-model="filters.endDate" @change="loadEvents()"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pines-500 focus:border-transparent">
                </div>
                <button @click="clearFilters()" class="px-4 py-2 text-gray-600 hover:text-gray-900 text-sm font-medium">Clear</button>
            </div>
            <div class="mt-3 text-sm text-gray-600">
                Showing <span class="font-medium" x-text="filteredEvents.length"></span> of <span x-text="totalCount"></span> events
            </div>
        </div>
    </div>

    <!-- Events table -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div x-show="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
        </div>

        <div x-show="!loading" class="bg-white rounded-lg shadow overflow-hidden">
            <!-- Empty state -->
            <div x-show="displayList.length === 0" class="text-center py-12">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900">No events found</h3>
                <p class="mt-1 text-sm text-gray-500">Try adjusting your filters or sync events from SportsEngine.</p>
            </div>

            <div class="overflow-x-auto">
                <table x-show="displayList.length > 0" class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="w-32 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                            <th class="w-24 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Event</th>
                            <th class="w-28 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sport</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teams / Score</th>
                            <th class="w-24 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <template x-for="entry in displayList" :key="entry._key">
                            <tr :class="entry._isHeader ? 'bg-pines-50 border-t-2 border-pines-200' : 'bg-white hover:bg-gray-50'">

                                <!-- DATE HEADER ROW -->
                                <template x-if="entry._isHeader">
                                    <td colspan="7" class="px-3 py-2">
                                        <span class="text-sm font-bold text-pines-700" x-text="entry._date"></span>
                                        <span class="ml-2 text-xs text-pines-500" x-text="entry._count + ' event' + (entry._count === 1 ? '' : 's')"></span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Time -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-3 py-2 text-sm text-gray-900 whitespace-nowrap" x-text="formatTimeRange(entry.startTime, entry.endTime)"></td>
                                </template>

                                <!-- EVENT ROW: Type badge -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-3 py-2">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium" :class="typeColor(entry.eventType)" x-text="typeLabel(entry.eventType)"></span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Name + description -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-3 py-2">
                                        <div class="text-sm font-medium text-gray-900" x-text="entry.name"></div>
                                        <div x-show="entry.description" class="text-xs text-gray-500 mt-0.5 line-clamp-1" x-text="entry.description"></div>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Sport -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-3 py-2">
                                        <span x-show="entry.sport" class="text-sm text-gray-700">
                                            <span x-html="sportEmoji(entry.sport)"></span>
                                            <span x-text="entry.sport"></span>
                                        </span>
                                        <span x-show="!entry.sport" class="text-sm text-gray-400">--</span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Location -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-3 py-2">
                                        <template x-if="entry.location">
                                            <div>
                                                <div class="text-sm text-gray-900" x-text="entry.location.name"></div>
                                                <div x-show="entry.location.address" class="text-xs text-gray-500 mt-0.5" x-text="entry.location.address"></div>
                                            </div>
                                        </template>
                                        <span x-show="!entry.location" class="text-sm text-gray-400">--</span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Teams / Score -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-3 py-2">
                                        <template x-if="entry.teams && entry.teams.length > 0">
                                            <div class="flex flex-wrap gap-1 items-center">
                                                <template x-for="(team, ti) in entry.teams" :key="ti">
                                                    <span class="inline-flex items-center text-xs">
                                                        <img x-show="team.logoUrl" :src="team.logoUrl" :alt="team.name"
                                                             class="w-5 h-5 object-contain rounded mr-1" @error="$el.style.display='none'">
                                                        <span class="px-1.5 py-0.5 rounded font-medium"
                                                              :class="team.homeTeam ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700'"
                                                              x-text="team.name || 'TBD'"></span>
                                                        <span x-show="team.score !== null && team.score !== undefined" class="ml-1 font-bold text-gray-900" x-text="team.score"></span>
                                                        <span x-show="ti < entry.teams.length - 1" class="mx-1 text-gray-400">vs</span>
                                                    </span>
                                                </template>
                                            </div>
                                        </template>
                                        <span x-show="!entry.teams || entry.teams.length === 0" class="text-sm text-gray-400">--</span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Status -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-3 py-2">
                                        <span x-show="entry.status" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium" :class="statusColor(entry.status)" x-text="entry.status"></span>
                                        <span x-show="!entry.status" class="text-sm text-gray-400">--</span>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Sync notification -->
    <div x-show="syncMessage" x-transition
         class="fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg text-sm font-medium"
         :class="syncSuccess ? 'bg-pines-500 text-white' : 'bg-red-500 text-white'"
         x-text="syncMessage"
         @click="syncMessage = ''">
    </div>

<script>
function eventsApp() {
    return {
        loading: true,
        syncing: false,
        syncMessage: '',
        syncSuccess: false,
        allEvents: [],
        filteredEvents: [],
        displayList: [],
        totalCount: 0,
        availableSports: [],
        filters: {
            search: '',
            sport: '',
            eventType: '',
            startDate: '',
            endDate: '',
        },

        async init() {
            const today = new Date();
            this.filters.startDate = this.toDateString(today);
            const future = new Date(today);
            future.setDate(future.getDate() + 30);
            this.filters.endDate = this.toDateString(future);
            await this.loadEvents();
            this.loading = false;
        },

        toDateString(d) {
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        },

        async loadEvents() {
            try {
                const params = new URLSearchParams();
                if (this.filters.eventType) params.set('event_type', this.filters.eventType);
                if (this.filters.sport) params.set('sport', this.filters.sport);
                if (this.filters.startDate) params.set('start_date', this.filters.startDate);
                if (this.filters.endDate) params.set('end_date', this.filters.endDate);
                if (this.filters.search) params.set('search', this.filters.search);

                const res = await fetch('/api/events/items?' + params.toString());
                const data = await res.json();
                this.allEvents = data.events;
                this.totalCount = data.count;
                this.updateAvailableOptions();
                this.filteredEvents = this.allEvents;
                this.buildDisplayList();
            } catch (e) {
                console.error('Failed to load events:', e);
            }
        },

        updateAvailableOptions() {
            this.availableSports = [...new Set(this.allEvents.map(e => e.sport).filter(Boolean))].sort();
        },

        buildDisplayList() {
            this.displayList = [];
            let lastDate = null;
            const dateCounts = {};

            // Events are already sorted by start_time ascending from the API
            this.filteredEvents.forEach(e => {
                const dateStr = this.formatDate(e.startTime);
                dateCounts[dateStr] = (dateCounts[dateStr] || 0) + 1;
            });

            this.filteredEvents.forEach(e => {
                const dateStr = this.formatDate(e.startTime);
                if (dateStr !== lastDate) {
                    this.displayList.push({
                        _isHeader: true,
                        _key: 'h-' + dateStr,
                        _date: dateStr,
                        _count: dateCounts[dateStr]
                    });
                    lastDate = dateStr;
                }
                this.displayList.push({ ...e, _isHeader: false, _key: 'e-' + e.id });
            });
        },

        // Formatting helpers
        formatDate(iso) {
            if (!iso) return 'No Date';
            return new Date(iso).toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });
        },

        formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        },

        formatTimeRange(start, end) {
            if (!start) return 'TBD';
            const s = this.formatTime(start);
            if (!end) return s;
            return s + ' - ' + this.formatTime(end);
        },

        typeLabel(type) {
            return (type || 'event').charAt(0).toUpperCase() + (type || 'event').slice(1);
        },

        typeColor(type) {
            if (type === 'game') return 'bg-blue-100 text-blue-700';
            if (type === 'practice') return 'bg-green-100 text-green-700';
            return 'bg-purple-100 text-purple-700';
        },

        statusColor(status) {
            if (!status) return 'bg-gray-100 text-gray-600';
            const s = status.toLowerCase();
            if (s === 'scheduled') return 'bg-blue-100 text-blue-700';
            if (s === 'completed') return 'bg-green-100 text-green-700';
            if (s === 'cancelled') return 'bg-red-100 text-red-700';
            return 'bg-gray-100 text-gray-600';
        },

        sportEmoji(sport) {
            const map = {
                'Soccer': '&#9917;',
                'Basketball': '&#127936;',
                'Flag Football': '&#127944;',
                'Baseball': '&#9918;',
                'Softball': '&#129358;',
                'Volleyball': '&#127952;',
            };
            return map[sport] || '';
        },

        async syncEvents() {
            this.syncing = true;
            this.syncMessage = '';
            try {
                const res = await fetch('/sync/events', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') {
                    this.syncSuccess = true;
                    this.syncMessage = 'Sync complete! ' + data.new_events + ' new, ' + data.updated_events + ' updated.';
                    await this.loadEvents();
                } else {
                    this.syncSuccess = false;
                    this.syncMessage = 'Sync failed: ' + (data.detail || 'Unknown error');
                }
            } catch (e) {
                this.syncSuccess = false;
                this.syncMessage = 'Sync failed: ' + e.message;
            }
            this.syncing = false;
            setTimeout(() => { this.syncMessage = ''; }, 5000);
        },

        clearFilters() {
            const today = new Date();
            const future = new Date(today);
            future.setDate(future.getDate() + 30);
            this.filters = {
                search: '',
                sport: '',
                eventType: '',
                startDate: this.toDateString(today),
                endDate: this.toDateString(future),
            };
            this.loadEvents();
        }
    }
}
</script>
</body>
</html>
