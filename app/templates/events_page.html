<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50" x-data="eventsApp()" x-init="init()" x-cloak>

    <!-- Filter bar -->
    <div class="bg-white border-b border-gray-200" x-data="{ showMore: false }">
        <div class="flex items-center gap-2 flex-nowrap px-6 py-2.5">
            <span class="text-xs text-gray-400 mr-1 shrink-0" x-text="filteredEvents.length + ' events'"></span>
            <!-- Search -->
            <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="search" x-model="filters.search" @input.debounce.300ms="loadEvents()" placeholder="Search..."
                       class="pl-8 pr-3 py-1.5 border border-gray-200 rounded-md text-xs w-48 focus:ring-1 focus:ring-pines-500 focus:border-pines-500 placeholder-gray-400">
            </div>
            <!-- All filter pills (behind + Filter) -->
            <template x-if="showMore || filters.sport || filters.eventType || filters.startDate || filters.endDate">
                <div class="contents">
                    <!-- Sport pill -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.sport ? 'border-pines-200 bg-pines-50 text-pines-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                            <span x-text="filters.sport || 'All sports'"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-40 bg-white border border-gray-200 rounded-lg shadow-lg py-1">
                            <div @click="filters.sport = ''; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs text-gray-500">All sports</div>
                            <template x-for="sp in availableSports" :key="sp">
                                <div @click="filters.sport = sp; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs"
                                     :class="filters.sport === sp ? 'bg-pines-50 text-pines-700 font-medium' : ''" x-text="sp"></div>
                            </template>
                        </div>
                    </div>
                    <!-- Type pill -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.eventType ? 'border-pines-200 bg-pines-50 text-pines-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                            <span x-text="filters.eventType ? typeLabel(filters.eventType) : 'All types'"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-32 bg-white border border-gray-200 rounded-lg shadow-lg py-1">
                            <div @click="filters.eventType = ''; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs text-gray-500">All types</div>
                            <template x-for="t in ['game', 'practice', 'event']" :key="t">
                                <div @click="filters.eventType = t; loadEvents(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs"
                                     :class="filters.eventType === t ? 'bg-pines-50 text-pines-700 font-medium' : ''">
                                    <span x-text="typeLabel(t)"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                    <!-- Date range -->
                    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium border border-gray-200">
                        <span class="text-gray-400">From</span>
                        <input type="date" x-model="filters.startDate" @change="loadEvents()"
                               class="border-0 p-0 text-xs w-28 focus:ring-0 text-gray-600">
                    </div>
                    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium border border-gray-200">
                        <span class="text-gray-400">To</span>
                        <input type="date" x-model="filters.endDate" @change="loadEvents()"
                               class="border-0 p-0 text-xs w-28 focus:ring-0 text-gray-600">
                    </div>
                    <!-- Collapse filters -->
                    <button x-show="showMore && !filters.sport && !filters.eventType && !filters.startDate && !filters.endDate"
                            @click="showMore = false"
                            class="text-xs text-gray-400 hover:text-gray-600 px-1 py-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </template>
            <!-- + Filter button -->
            <button x-show="!showMore && !filters.sport && !filters.eventType && !filters.startDate && !filters.endDate"
                    @click="showMore = true"
                    class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border border-dashed border-gray-300 text-gray-400 hover:text-gray-600 hover:border-gray-400 transition-colors">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Filter
            </button>
            <!-- Clear -->
            <button x-show="filters.search || filters.sport || filters.eventType || filters.startDate || filters.endDate"
                    @click="showMore = false; clearFilters()" class="text-xs text-gray-400 hover:text-gray-600 px-1.5 py-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <!-- Sync button pushed right -->
            <div class="ml-auto">
                <button @click="syncEvents()" :disabled="syncing"
                        class="bg-pines-500 hover:bg-pines-600 disabled:opacity-50 text-white px-3 py-1.5 rounded-md text-xs font-medium">
                    <span x-show="!syncing">Sync Events</span>
                    <span x-show="syncing">Syncing...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Events table -->
    <main class="px-6 py-6">
        <div x-show="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
        </div>

        <div x-show="!loading" class="bg-white border border-gray-200 rounded-lg overflow-hidden">
            <!-- Empty state -->
            <div x-show="displayList.length === 0" class="text-center py-12">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900">No events found</h3>
                <p class="mt-1 text-sm text-gray-500">Try adjusting your filters or sync events from SportsEngine.</p>
            </div>

            <div class="overflow-x-auto">
                <table x-show="displayList.length > 0" class="min-w-full">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 whitespace-nowrap">Time</th>
                            <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 whitespace-nowrap">Type</th>
                            <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 whitespace-nowrap">Teams</th>
                            <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 whitespace-nowrap">Location</th>
                            <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 whitespace-nowrap">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="entry in displayList" :key="entry._key">
                            <tr :class="entry._isHeader ? 'bg-gray-50 border-t border-gray-200' : 'hover:bg-gray-50 cursor-pointer transition-colors border-b border-gray-100'"
                                @click="!entry._isHeader && openPanel(entry)">

                                <!-- DATE HEADER ROW -->
                                <template x-if="entry._isHeader">
                                    <td colspan="5" class="px-4 py-2">
                                        <span class="text-xs font-semibold text-gray-700" x-text="entry._date"></span>
                                        <span class="ml-1.5 text-xs text-gray-500" x-text="entry._count + ' event' + (entry._count === 1 ? '' : 's')"></span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Time -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-4 py-3 text-sm text-gray-900 whitespace-nowrap" x-text="formatTimeRange(entry.startTime, entry.endTime)"></td>
                                </template>

                                <!-- EVENT ROW: Type badge -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <span class="text-xs text-gray-900" x-text="typeLabel(entry.eventType)"></span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Teams matchup / Coach -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <template x-if="entry.teams && entry.teams.length > 0">
                                            <div class="flex items-center gap-1.5">
                                                <template x-for="(team, ti) in entry.teams" :key="ti">
                                                    <div class="flex items-center gap-1">
                                                        <span x-show="ti > 0" class="text-xs text-gray-300 mx-0.5">vs</span>
                                                        <img x-show="team.logoUrl" :src="team.logoUrl" class="w-5 h-5 object-contain rounded" @error="$el.style.display='none'">
                                                        <span class="text-xs text-gray-900 max-w-[8rem] truncate" x-text="team.name || 'TBD'"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <span x-show="!entry.teams || entry.teams.length === 0" class="text-sm text-gray-300">--</span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Location -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <template x-if="entry.location">
                                            <div>
                                                <div class="text-sm text-gray-900" x-text="entry.location.name"></div>
                                                <div x-show="entry.location.description" class="text-xs text-gray-500 mt-0.5" x-text="entry.location.description"></div>
                                            </div>
                                        </template>
                                        <span x-show="!entry.location" class="text-sm text-gray-300">--</span>
                                    </td>
                                </template>

                                <!-- EVENT ROW: Status -->
                                <template x-if="!entry._isHeader">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <span x-show="entry.status" class="text-xs" :class="statusTextColor(entry.status)" x-text="entry.status"></span>
                                        <span x-show="!entry.status" class="text-sm text-gray-300">--</span>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Detail Side Panel -->
    <div x-show="panelOpen" x-cloak class="fixed inset-0 z-30" @click.self="closePanel()">
        <div x-show="panelOpen"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
             class="absolute top-0 right-0 h-full w-full sm:w-96 bg-white border-l border-gray-200 shadow-lg flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 flex-shrink-0">
                <h2 class="text-lg font-semibold text-gray-900 truncate" x-text="selectedEvent?.name || 'Event Details'"></h2>
                <button @click="closePanel()" class="p-1 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <template x-if="selectedEvent">
            <div class="flex-1 overflow-y-auto px-6 py-5 space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Type</label>
                        <span class="text-sm text-gray-900" x-text="typeLabel(selectedEvent.eventType)"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Status</label>
                        <span x-show="selectedEvent.status" class="text-sm" :class="statusTextColor(selectedEvent.status)" x-text="selectedEvent.status"></span>
                        <span x-show="!selectedEvent.status" class="text-sm text-gray-400">--</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Date &amp; Time</label>
                    <p class="text-sm text-gray-900" x-text="formatDate(selectedEvent.startTime)"></p>
                    <p class="text-sm text-gray-900" x-text="formatTimeRange(selectedEvent.startTime, selectedEvent.endTime)"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Sport</label>
                    <p class="text-sm text-gray-900">
                        <span x-html="sportEmoji(selectedEvent.sport)"></span>
                        <span x-text="selectedEvent.sport || '--'"></span>
                    </p>
                </div>
                <div x-show="selectedEvent.eventType === 'practice' && selectedEvent.teams && selectedEvent.teams.length > 0">
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Coach / Group</label>
                    <p class="text-sm font-medium text-pines-700" x-text="selectedEvent.teams && selectedEvent.teams[0] ? selectedEvent.teams[0].name : '--'"></p>
                </div>
                <div x-show="selectedEvent.location">
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Location</label>
                    <p class="text-sm text-gray-900" x-text="selectedEvent.location?.name"></p>
                    <p x-show="selectedEvent.location?.description" class="text-xs text-pines-600 font-medium mt-0.5" x-text="selectedEvent.location?.description"></p>
                    <p x-show="selectedEvent.location?.address" class="text-xs text-gray-500 mt-0.5" x-text="selectedEvent.location?.address"></p>
                </div>
                <div x-show="selectedEvent.teams && selectedEvent.teams.length > 0">
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Teams</label>
                    <div class="space-y-2">
                        <template x-for="(team, ti) in selectedEvent.teams || []" :key="ti">
                            <div class="flex items-center gap-2 p-2.5 bg-gray-50 rounded-lg">
                                <img x-show="team.logoUrl" :src="team.logoUrl" class="w-6 h-6 object-contain rounded" @error="$el.style.display='none'">
                                <span class="text-sm font-medium text-gray-900" x-text="team.name || 'TBD'"></span>
                                <span x-show="team.homeTeam" class="px-1.5 py-0.5 text-xs rounded-full bg-blue-100 text-blue-700">Home</span>
                                <span x-show="team.score !== null && team.score !== undefined" class="ml-auto text-lg font-bold text-gray-900" x-text="team.score"></span>
                            </div>
                        </template>
                    </div>
                </div>
                <div x-show="selectedEvent.description">
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Description</label>
                    <p class="text-sm text-gray-900" x-text="selectedEvent.description"></p>
                </div>
            </div>
            </template>
        </div>
    </div>

    <!-- Sync notification -->
    <div x-show="syncMessage" x-transition
         class="fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg text-sm font-medium"
         :class="syncSuccess ? 'bg-pines-500 text-white' : 'bg-red-500 text-white'"
         x-text="syncMessage"
         @click="syncMessage = ''">
    </div>

<script>
function eventsApp() {
    return {
        loading: true,
        syncing: false,
        syncMessage: '',
        syncSuccess: false,
        panelOpen: false,
        selectedEvent: null,
        allEvents: [],
        filteredEvents: [],
        displayList: [],
        totalCount: 0,
        availableSports: [],
        filters: {
            search: '',
            sport: '',
            eventType: '',
            startDate: '',
            endDate: '',
        },

        async init() {
            await this.loadEvents();
            this.loading = false;
        },

        toDateString(d) {
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        },

        async loadEvents() {
            try {
                const params = new URLSearchParams();
                if (this.filters.eventType) params.set('event_type', this.filters.eventType);
                if (this.filters.sport) params.set('sport', this.filters.sport);
                // Default to today + 30 days when no dates are explicitly set
                if (this.filters.startDate) {
                    params.set('start_date', this.filters.startDate);
                } else {
                    params.set('start_date', this.toDateString(new Date()));
                }
                if (this.filters.endDate) {
                    params.set('end_date', this.filters.endDate);
                } else {
                    const future = new Date();
                    future.setDate(future.getDate() + 30);
                    params.set('end_date', this.toDateString(future));
                }
                if (this.filters.search) params.set('search', this.filters.search);

                const res = await fetch('/api/events/items?' + params.toString());
                const data = await res.json();
                this.allEvents = data.events;
                this.totalCount = data.count;
                this.updateAvailableOptions();
                this.filteredEvents = this.allEvents;
                this.buildDisplayList();
            } catch (e) {
                console.error('Failed to load events:', e);
            }
        },

        updateAvailableOptions() {
            this.availableSports = [...new Set(this.allEvents.map(e => e.sport).filter(Boolean))].sort();
        },

        buildDisplayList() {
            this.displayList = [];
            let lastDate = null;
            const dateCounts = {};

            // Events are already sorted by start_time ascending from the API
            this.filteredEvents.forEach(e => {
                const dateStr = this.formatDate(e.startTime);
                dateCounts[dateStr] = (dateCounts[dateStr] || 0) + 1;
            });

            this.filteredEvents.forEach(e => {
                const dateStr = this.formatDate(e.startTime);
                if (dateStr !== lastDate) {
                    this.displayList.push({
                        _isHeader: true,
                        _key: 'h-' + dateStr,
                        _date: dateStr,
                        _count: dateCounts[dateStr]
                    });
                    lastDate = dateStr;
                }
                this.displayList.push({ ...e, _isHeader: false, _key: 'e-' + e.id });
            });
        },

        // Formatting helpers
        formatDate(iso) {
            if (!iso) return 'No Date';
            return new Date(iso).toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });
        },

        formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        },

        formatTimeRange(start, end) {
            if (!start) return 'TBD';
            const s = this.formatTime(start);
            if (!end) return s;
            return s + ' - ' + this.formatTime(end);
        },

        typeLabel(type) {
            return (type || 'event').charAt(0).toUpperCase() + (type || 'event').slice(1);
        },

        typeColor(type) {
            if (type === 'game') return 'bg-blue-100 text-blue-700';
            if (type === 'practice') return 'bg-green-100 text-green-700';
            return 'bg-purple-100 text-purple-700';
        },

        statusColor(status) {
            if (!status) return 'bg-gray-100 text-gray-600';
            const s = status.toLowerCase();
            if (s === 'scheduled') return 'bg-blue-100 text-blue-700';
            if (s === 'completed') return 'bg-green-100 text-green-700';
            if (s === 'cancelled') return 'bg-red-100 text-red-700';
            return 'bg-gray-100 text-gray-600';
        },

        statusTextColor(status) {
            if (!status) return 'text-gray-400';
            const s = status.toLowerCase();
            if (s === 'scheduled') return 'text-blue-600';
            if (s === 'completed') return 'text-green-600';
            if (s === 'cancelled') return 'text-red-500';
            return 'text-gray-500';
        },

        sportEmoji(sport) {
            const map = {
                'Soccer': '&#9917;',
                'Basketball': '&#127936;',
                'Flag Football': '&#127944;',
                'Baseball': '&#9918;',
                'Softball': '&#129358;',
                'Volleyball': '&#127952;',
            };
            return map[sport] || '';
        },

        async syncEvents() {
            this.syncing = true;
            this.syncMessage = '';
            try {
                const res = await fetch('/sync/events', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') {
                    this.syncSuccess = true;
                    this.syncMessage = 'Sync complete! ' + data.new_events + ' new, ' + data.updated_events + ' updated.';
                    await this.loadEvents();
                } else {
                    this.syncSuccess = false;
                    this.syncMessage = 'Sync failed: ' + (data.detail || 'Unknown error');
                }
            } catch (e) {
                this.syncSuccess = false;
                this.syncMessage = 'Sync failed: ' + e.message;
            }
            this.syncing = false;
            setTimeout(() => { this.syncMessage = ''; }, 5000);
        },

        openPanel(event) {
            this.selectedEvent = { ...event };
            this.panelOpen = true;
        },

        closePanel() {
            this.panelOpen = false;
            this.selectedEvent = null;
        },

        clearFilters() {
            this.filters = {
                search: '',
                sport: '',
                eventType: '',
                startDate: '',
                endDate: '',
            };
            this.loadEvents();
        }
    }
}
</script>
