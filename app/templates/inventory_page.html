<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Equipment Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-white" x-data="inventoryApp()" x-init="init()" x-cloak>

    <!-- Header — matches jersey app -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="/admin">
                    <img src="https://cdn.prod.website-files.com/681d81085457ff1ea60182c2/684103edf65163765f534531_PINES_LOGO_DARK.svg" alt="Pines" class="h-10">
                </a>
                <div class="flex items-center space-x-6">
                    <a href="/admin" class="text-gray-600 hover:text-gray-900 text-sm font-medium">Players</a>
                    <button @click="showCheckoutsView = false"
                            class="text-sm font-medium"
                            :class="!showCheckoutsView ? 'text-gray-900' : 'text-gray-600 hover:text-gray-900'">Inventory</button>
                    <span class="relative pr-3">
                        <button @click="showCheckoutsView = true"
                                class="text-sm font-medium"
                                :class="showCheckoutsView ? 'text-gray-900' : 'text-gray-600 hover:text-gray-900'">
                            Checked Out
                        </button>
                        <span x-show="totalCheckedOut > 0" class="absolute -top-2 -right-0 bg-orange-500 text-white rounded-full w-4 h-4 flex items-center justify-center" style="font-size:10px" x-text="totalCheckedOut"></span>
                    </span>
                    <button @click="openBulkCheckout()" class="border border-pines-500 text-pines-600 hover:bg-pines-50 px-4 py-2 rounded-lg text-sm font-medium">Equipment Checkout</button>
                    <button @click="openAddModal()" class="bg-pines-500 hover:bg-pines-600 text-white px-4 py-2 rounded-lg text-sm font-medium">+ Add Item</button>
                </div>
            </div>
        </div>
    </header>

    <!-- ==================== INVENTORY VIEW ==================== -->
    <div x-show="!showCheckoutsView">
        <!-- Filters — match jersey app layout exactly -->
        <div class="max-w-7xl mx-auto px-4 pt-6">
            <div class="flex items-end justify-between gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-900 mb-1">Search</label>
                    <input type="search" x-model="filters.search" @input.debounce.300ms="applyFilters()" placeholder="Name, location, or notes..."
                           class="w-80 px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-pines-500">
                </div>
                <div class="flex items-end gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-900 mb-1">Sport</label>
                        <select x-model="filters.sport" @change="applyFilters()" class="px-2 py-1.5 border border-gray-300 rounded text-sm">
                            <option value="">All</option>
                            <option value="Basketball">Basketball</option>
                            <option value="Soccer">Soccer</option>
                            <option value="Flag Football">Flag Football</option>
                            <option value="Volleyball">Volleyball</option>
                            <option value="POSA">POSA</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-900 mb-1">Category</label>
                        <select x-model="filters.category" @change="applyFilters()" class="px-2 py-1.5 border border-gray-300 rounded text-sm">
                            <option value="">All</option>
                            <template x-for="cat in uniqueCategories" :key="cat">
                                <option :value="cat" x-text="cat"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-900 mb-1">Division</label>
                        <select x-model="filters.division" @change="applyFilters()" class="px-2 py-1.5 border border-gray-300 rounded text-sm">
                            <option value="">All</option>
                            <template x-for="div in uniqueDivisions" :key="div">
                                <option :value="div" x-text="div"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-900 mb-1">Condition</label>
                        <select x-model="filters.condition" @change="applyFilters()" class="px-2 py-1.5 border border-gray-300 rounded text-sm">
                            <option value="">All</option>
                            <option value="New">New</option>
                            <option value="Good">Good</option>
                            <option value="Fair">Fair</option>
                            <option value="Poor">Poor</option>
                            <option value="Replace">Replace</option>
                        </select>
                    </div>
                    <button @click="clearFilters()" x-show="hasActiveFilters()" class="px-2 py-1.5 text-sm text-gray-500 hover:text-gray-900">Clear</button>
                </div>
            </div>
            <div class="text-sm text-gray-500 mt-3" x-text="'Showing ' + filteredItems.length + ' of ' + items.length + ' items'"></div>
        </div>

        <!-- Items table -->
        <div class="max-w-7xl mx-auto px-4 pt-6 pb-8">
            <div x-show="loading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
            </div>
            <table x-show="!loading && filteredItems.length > 0" class="min-w-full divide-y divide-gray-200">
                <thead>
                    <tr>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Coach</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Qty</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Notes</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"></th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Checked Out</th>
                        <th class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 bg-white">
                    <template x-for="item in filteredItems" :key="item.id">
                        <template x-for="(row, rowIdx) in inventoryRows(item)" :key="row._key">
                            <tr>
                                <!-- ITEM GROUP HEADER — like "Birth Year 2022  9 players" -->
                                <template x-if="row._type === 'item'">
                                    <td class="px-3 py-2" colspan="4">
                                        <span class="text-sm font-bold text-gray-900" x-text="item.name"></span>
                                        <span x-show="item.division" class="ml-2 text-sm text-gray-400" x-text="item.division"></span>
                                        <span class="ml-3 text-sm text-gray-400">
                                            <span x-text="item.quantityTotal"></span> total, <span class="text-pines-600 font-semibold" x-text="item.quantityAvailable"></span> available<template x-if="item.checkedOut > 0"><span class="text-orange-500">, <span x-text="item.checkedOut"></span> out</span></template>
                                        </span>
                                        <template x-for="cb in (item.conditions || [])" :key="cb.condition">
                                            <span class="ml-1 text-xs px-2 py-0.5 rounded font-medium" :class="conditionColor(cb.condition)">
                                                <span x-text="cb.quantity"></span> <span x-text="cb.condition"></span>
                                            </span>
                                        </template>
                                        <span x-show="item.location" class="ml-3 text-sm text-gray-400" x-text="'📍 ' + item.location"></span>
                                    </td>
                                </template>
                                <template x-if="row._type === 'item'">
                                    <td class="px-3 py-2" colspan="2">
                                        <div class="flex items-center justify-end space-x-1">
                                            <button @click="openCheckoutModal(item)" class="p-1.5 rounded hover:bg-gray-100 text-gray-400 hover:text-pines-600" title="Check out" :disabled="item.quantityAvailable <= 0">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                            </button>
                                            <button @click="editItem(item)" class="p-1.5 rounded hover:bg-gray-100 text-gray-400 hover:text-pines-600" title="Edit">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                            </button>
                                            <button @click="deleteItem(item)" class="p-1.5 rounded hover:bg-gray-100 text-gray-400 hover:text-red-500" title="Delete">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </div>
                                    </td>
                                </template>
                                <!-- CHECKOUT ROW — like a player row in the jersey app -->
                                <template x-if="row._type === 'checkout'">
                                    <td class="px-3 py-3 text-sm text-gray-900" x-text="row.personName"></td>
                                </template>
                                <template x-if="row._type === 'checkout'">
                                    <td class="px-3 py-3 text-sm text-gray-900" x-text="row.quantity"></td>
                                </template>
                                <template x-if="row._type === 'checkout'">
                                    <td class="px-3 py-3 text-sm text-gray-500" x-text="row.notes || ''"></td>
                                </template>
                                <template x-if="row._type === 'checkout'">
                                    <td class="px-3 py-3"></td>
                                </template>
                                <template x-if="row._type === 'checkout'">
                                    <td class="px-3 py-3 text-sm text-gray-500" x-text="formatDate(row.checkedOutAt)"></td>
                                </template>
                                <template x-if="row._type === 'checkout'">
                                    <td class="px-3 py-3 text-right">
                                        <button @click="returnCheckoutRecord(item.id, row.id, row.personName, row.quantity)"
                                                class="p-1 rounded hover:bg-gray-100 text-gray-400 hover:text-pines-600" title="Return">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        </button>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </template>
                </tbody>
            </table>
            <div x-show="!loading && filteredItems.length === 0" class="text-center py-12">
                <p class="text-gray-500" x-text="hasActiveFilters() ? 'No items match your filters' : 'No items yet — add one to get started'"></p>
            </div>
        </div>
    </div>

    <!-- ==================== CHECKED OUT VIEW ==================== -->
    <div x-show="showCheckoutsView">
        <div class="max-w-7xl mx-auto px-4 pt-6">
            <div class="text-sm text-gray-500" x-text="totalCheckedOut + ' ' + (totalCheckedOut !== 1 ? 'people have' : 'person has') + ' equipment checked out'"></div>
        </div>

        <div class="max-w-7xl mx-auto px-4 pt-6 pb-8">
            <div x-show="checkoutPeople.length === 0" class="text-center py-12">
                <p class="text-gray-500">No equipment currently checked out</p>
            </div>

            <table x-show="checkoutPeople.length > 0" class="min-w-full divide-y divide-gray-200">
                <thead>
                    <tr>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Item</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                        <th class="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Qty</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Notes</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Checked Out</th>
                        <th class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 bg-white">
                    <template x-for="row in checkoutDisplayList" :key="row._key">
                        <tr :class="row._isHeader ? 'bg-pines-50' : 'hover:bg-gray-50'">
                            <!-- Person header row -->
                            <template x-if="row._isHeader">
                                <td colspan="5" class="px-3 py-2">
                                    <span class="text-sm font-bold text-pines-700" x-text="row._personName"></span>
                                    <span class="ml-2 text-xs text-pines-500" x-text="row._totalItems + ' unit' + (row._totalItems !== 1 ? 's' : '')"></span>
                                </td>
                            </template>
                            <template x-if="row._isHeader">
                                <td class="px-3 py-2 text-right">
                                    <button @click="returnAllForPerson(row._personName)"
                                            class="text-xs px-2 py-1 bg-pines-100 text-pines-700 rounded hover:bg-pines-200 font-medium">
                                        Return All
                                    </button>
                                </td>
                            </template>
                            <!-- Item rows -->
                            <template x-if="!row._isHeader">
                                <td class="px-3 py-3">
                                    <span class="text-sm font-medium text-gray-900" x-text="row.itemName"></span>
                                </td>
                            </template>
                            <template x-if="!row._isHeader">
                                <td class="px-3 py-3 text-sm text-gray-500" x-text="row.itemCategory"></td>
                            </template>
                            <template x-if="!row._isHeader">
                                <td class="px-3 py-3 text-center text-sm font-medium" x-text="row.quantity"></td>
                            </template>
                            <template x-if="!row._isHeader">
                                <td class="px-3 py-3 text-xs text-gray-400 italic" x-text="row.notes || '-'"></td>
                            </template>
                            <template x-if="!row._isHeader">
                                <td class="px-3 py-3 text-sm text-gray-500" x-text="formatDate(row.checkedOutAt)"></td>
                            </template>
                            <template x-if="!row._isHeader">
                                <td class="px-3 py-3 text-right">
                                    <button @click="returnCheckoutRecord(row.itemId, row.id, row._personName, row.quantity)"
                                            class="p-1 rounded hover:bg-gray-100 text-pines-500" title="Return">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </button>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ==================== ADD/EDIT ITEM MODAL ==================== -->
    <div x-show="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" @click.self="showModal = false">
        <div class="bg-white rounded-lg p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4" x-text="editingId ? 'Edit Item' : 'Add New Item'"></h3>
            <div class="mb-3">
                <label class="block text-xs font-medium text-gray-700 mb-1">Name *</label>
                <input type="text" x-model="form.name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 text-sm" placeholder="e.g. Size 5 Soccer Balls">
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Category *</label>
                    <input type="text" x-model="form.category" list="category-suggestions"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 text-sm"
                           placeholder="e.g. Balls, Goals, Jerseys...">
                    <datalist id="category-suggestions">
                        <template x-for="cat in uniqueCategories" :key="cat">
                            <option :value="cat"></option>
                        </template>
                    </datalist>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Sport</label>
                    <select x-model="form.sport" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 text-sm">
                        <option value="">None</option>
                        <option value="Basketball">Basketball</option>
                        <option value="Soccer">Soccer</option>
                        <option value="Flag Football">Flag Football</option>
                        <option value="Volleyball">Volleyball</option>
                        <option value="POSA">POSA</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="block text-xs font-medium text-gray-700 mb-1">Division</label>
                <input type="text" x-model="form.division" list="division-suggestions"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 text-sm"
                       placeholder="e.g. U10, U12, Varsity...">
                <datalist id="division-suggestions">
                    <template x-for="div in uniqueDivisions" :key="div">
                        <option :value="div"></option>
                    </template>
                </datalist>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div><label class="block text-xs font-medium text-gray-700 mb-1">Total Qty</label><input type="number" x-model.number="form.quantity_total" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
                <div><label class="block text-xs font-medium text-gray-700 mb-1">Available</label><input type="number" x-model.number="form.quantity_available" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div><label class="block text-xs font-medium text-gray-700 mb-1">Location</label><input type="text" x-model="form.location" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="e.g. Shed A"></div>
                <div><label class="block text-xs font-medium text-gray-700 mb-1">Min Alert</label><input type="number" x-model.number="form.min_quantity" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
            </div>

            <!-- Condition breakdown -->
            <div class="mb-3">
                <label class="block text-xs font-medium text-gray-700 mb-2">Condition Breakdown</label>
                <div class="space-y-2">
                    <template x-for="(cb, idx) in form.conditions" :key="idx">
                        <div class="flex items-center gap-2">
                            <input type="number" x-model.number="cb.quantity" min="0" class="w-20 px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-center">
                            <select x-model="cb.condition" class="flex-1 px-2 py-1.5 border border-gray-300 rounded-lg text-sm">
                                <option value="New">New</option>
                                <option value="Good">Good</option>
                                <option value="Fair">Fair</option>
                                <option value="Poor">Poor</option>
                                <option value="Replace">Replace</option>
                            </select>
                            <button @click="form.conditions.splice(idx, 1)" class="text-red-400 hover:text-red-600 text-sm font-bold px-1">✕</button>
                        </div>
                    </template>
                </div>
                <button @click="form.conditions.push({condition: 'Good', quantity: 0})" class="mt-2 text-xs text-pines-600 hover:text-pines-800 font-medium">+ Add condition split</button>
            </div>
            <div class="mb-3"><label class="block text-xs font-medium text-gray-700 mb-1">Cost per Unit ($)</label><input type="number" x-model="form.cost_per_unit" step="0.01" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
            <div class="mb-4"><label class="block text-xs font-medium text-gray-700 mb-1">Notes</label><textarea x-model="form.notes" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></textarea></div>
            <div class="flex justify-end space-x-3">
                <button @click="showModal = false" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-sm">Cancel</button>
                <button @click="saveItem()" class="px-4 py-2 bg-pines-500 text-white rounded-lg hover:bg-pines-600 text-sm">Save</button>
            </div>
        </div>
    </div>

    <!-- ==================== SINGLE CHECKOUT MODAL ==================== -->
    <div x-show="showCheckoutModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" @click.self="showCheckoutModal = false">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h3 class="text-lg font-bold mb-1">Check Out Equipment</h3>
            <p class="text-sm text-gray-500 mb-4" x-text="checkoutItem ? checkoutItem.name + ' (' + checkoutItem.quantityAvailable + ' available)' : ''"></p>
            <div class="mb-3">
                <label class="block text-xs font-medium text-gray-700 mb-1">Who is checking this out? *</label>
                <input type="text" x-model="checkoutForm.person_name" x-ref="checkoutName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 text-sm" placeholder="e.g. Coach Smith" @keyup.enter="submitCheckout()">
            </div>
            <div class="mb-3">
                <label class="block text-xs font-medium text-gray-700 mb-1">Quantity</label>
                <input type="number" x-model.number="checkoutForm.quantity" min="1" :max="checkoutItem ? checkoutItem.quantityAvailable : 1" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-700 mb-1">Notes (optional)</label>
                <input type="text" x-model="checkoutForm.notes" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="e.g. For Saturday practice">
            </div>
            <div class="flex justify-end space-x-3">
                <button @click="showCheckoutModal = false" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-sm">Cancel</button>
                <button @click="submitCheckout()" class="px-4 py-2 bg-pines-500 text-white rounded-lg hover:bg-pines-600 text-sm">Check Out</button>
            </div>
        </div>
    </div>

    <!-- ==================== EQUIPMENT CHECKOUT MODAL ==================== -->
    <div x-show="showBulkModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" @click.self="showBulkModal = false">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4">Equipment Checkout</h3>
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-700 mb-1">Who is checking out? *</label>
                <input type="text" x-model="bulkForm.person_name" x-ref="bulkPersonName"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 text-sm"
                       placeholder="e.g. Coach Smith">
            </div>
            <div x-show="bulkForm.items.length > 0" class="mb-4">
                <label class="block text-xs font-medium text-gray-700 mb-2">Items to check out:</label>
                <div class="space-y-2">
                    <template x-for="(bi, idx) in bulkForm.items" :key="idx">
                        <div class="flex items-center justify-between bg-pines-50 rounded-lg px-3 py-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-sm font-medium" x-text="bi._name"></span>
                                <span class="text-xs text-gray-500" x-text="'×' + bi.quantity"></span>
                            </div>
                            <button @click="bulkForm.items.splice(idx, 1)" class="text-red-400 hover:text-red-600 text-sm font-bold">✕</button>
                        </div>
                    </template>
                </div>
            </div>
            <div class="bg-gray-50 rounded-lg p-3 mb-4">
                <label class="block text-xs font-medium text-gray-700 mb-2">Add an item:</label>
                <div class="flex gap-2 items-end">
                    <div class="flex-1">
                        <select x-model="bulkAddItemId" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pines-500">
                            <option value="">Select item...</option>
                            <template x-for="item in availableForBulk" :key="item.id">
                                <option :value="item.id" x-text="item.name + ' (' + item.quantityAvailable + ' avail)'"></option>
                            </template>
                        </select>
                    </div>
                    <div class="w-20">
                        <input type="number" x-model.number="bulkAddQty" min="1" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Qty">
                    </div>
                    <button @click="addToBulk()" class="px-3 py-2 bg-pines-100 text-pines-700 rounded-lg hover:bg-pines-200 text-sm font-medium whitespace-nowrap">+ Add</button>
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <button @click="showBulkModal = false" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-sm">Cancel</button>
                <button @click="submitBulkCheckout()" :disabled="bulkForm.items.length === 0"
                        class="px-4 py-2 bg-pines-500 text-white rounded-lg hover:bg-pines-600 text-sm disabled:opacity-50">
                    Check Out <span x-text="bulkForm.items.length"></span> Item<span x-show="bulkForm.items.length !== 1">s</span>
                </button>
            </div>
        </div>
    </div>

    <script>
    function inventoryApp() {
        return {
            loading: true,
            showModal: false,
            showCheckoutModal: false,
            showBulkModal: false,
            showCheckoutsView: false,
            editingId: null,
            items: [],
            filteredItems: [],
            categories: [],
            uniqueCategories: [],
            uniqueDivisions: [],
            summary: {},
            checkoutPeople: [],
            checkoutDisplayList: [],
            totalCheckedOut: 0,
            filters: { search: '', category: '', sport: '', division: '', condition: '', lowStock: false },
            form: { name: '', category: '', sport: '', division: '', quantity_total: 0, quantity_available: 0, conditions: [{condition: 'New', quantity: 0}], location: '', notes: '', min_quantity: 0, cost_per_unit: null },
            checkoutItem: null,
            checkoutForm: { person_name: '', quantity: 1, notes: '' },
            bulkForm: { person_name: '', items: [] },
            bulkAddItemId: '',
            bulkAddQty: 1,

            async init() {
                await Promise.all([this.loadItems(), this.loadCategories(), this.loadCheckoutPeople()]);
                this.loading = false;
            },

            async loadItems() {
                try {
                    const res = await fetch('/api/inventory/items');
                    const data = await res.json();
                    this.items = data.items;
                    this.uniqueCategories = [...new Set(this.items.map(i => i.category).filter(Boolean))].sort();
                    this.uniqueDivisions = [...new Set(this.items.map(i => i.division).filter(Boolean))].sort();
                    this.applyFilters();
                } catch (e) { console.error(e); }
            },
            async loadCategories() {
                try { const res = await fetch('/api/inventory/categories'); const data = await res.json(); this.categories = data.categories; } catch (e) { console.error(e); }
            },
            async loadCheckoutPeople() {
                try {
                    const res = await fetch('/api/inventory/checkouts/by-person');
                    const data = await res.json();
                    this.checkoutPeople = data.people;
                    this.totalCheckedOut = this.checkoutPeople.length;
                    this.checkoutDisplayList = [];
                    this.checkoutPeople.forEach(person => {
                        this.checkoutDisplayList.push({ _isHeader: true, _key: 'h-' + person.personName, _personName: person.personName, _totalItems: person.totalItems });
                        person.items.forEach(co => {
                            this.checkoutDisplayList.push({ ...co, _isHeader: false, _key: 'co-' + co.id, _personName: person.personName });
                        });
                    });
                } catch (e) { console.error(e); }
            },
            async refresh() {
                await Promise.all([this.loadItems(), this.loadCheckoutPeople()]);
            },

            applyFilters() {
                this.filteredItems = this.items.filter(item => {
                    if (this.filters.search) { const s = this.filters.search.toLowerCase(); if (!item.name.toLowerCase().includes(s) && !(item.location||'').toLowerCase().includes(s) && !(item.notes||'').toLowerCase().includes(s)) return false; }
                    if (this.filters.category && item.category !== this.filters.category) return false;
                    if (this.filters.sport && (item.sport||'') !== this.filters.sport) return false;
                    if (this.filters.division && (item.division||'') !== this.filters.division) return false;
                    if (this.filters.condition) {
                        const hasCondition = (item.conditions || []).some(c => c.condition === this.filters.condition);
                        if (!hasCondition && item.condition !== this.filters.condition) return false;
                    }
                    if (this.filters.lowStock && !item.lowStock) return false;
                    return true;
                });
            },
            hasActiveFilters() { return this.filters.search || this.filters.category || this.filters.sport || this.filters.division || this.filters.condition || this.filters.lowStock; },
            clearFilters() { this.filters = { search: '', category: '', sport: '', division: '', condition: '', lowStock: false }; this.applyFilters(); },

            openAddModal() { this.editingId = null; this.form = { name: '', category: '', sport: '', division: '', quantity_total: 0, quantity_available: 0, conditions: [{condition: 'New', quantity: 0}], location: '', notes: '', min_quantity: 0, cost_per_unit: null }; this.showModal = true; },
            editItem(item) {
                this.editingId = item.id;
                const conds = (item.conditions && item.conditions.length > 0)
                    ? item.conditions.map(c => ({...c}))
                    : [{condition: item.condition || 'Good', quantity: item.quantityTotal}];
                this.form = { name: item.name, category: item.category, sport: item.sport||'', division: item.division||'', quantity_total: item.quantityTotal, quantity_available: item.quantityAvailable, conditions: conds, location: item.location||'', notes: item.notes||'', min_quantity: item.minQuantity||0, cost_per_unit: item.costPerUnit };
                this.showModal = true;
            },
            async saveItem() {
                if (!this.form.name || !this.form.category) { alert('Name and category are required'); return; }
                const url = this.editingId ? `/api/inventory/items/${this.editingId}` : '/api/inventory/items';
                try { await fetch(url, { method: this.editingId ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(this.form) }); this.showModal = false; await this.refresh(); } catch(e) { alert('Failed to save'); }
            },
            async deleteItem(item) {
                if (!confirm(`Delete "${item.name}"?`)) return;
                try { await fetch(`/api/inventory/items/${item.id}`, {method:'DELETE'}); await this.refresh(); } catch(e) { alert('Failed'); }
            },

            openCheckoutModal(item) {
                if (item.quantityAvailable <= 0) return;
                this.checkoutItem = item;
                this.checkoutForm = { person_name: '', quantity: 1, notes: '' };
                this.showCheckoutModal = true;
                this.$nextTick(() => { if(this.$refs.checkoutName) this.$refs.checkoutName.focus(); });
            },
            async submitCheckout() {
                if (!this.checkoutForm.person_name.trim()) { alert('Please enter a name.'); return; }
                try {
                    const res = await fetch(`/api/inventory/items/${this.checkoutItem.id}/checkout`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(this.checkoutForm) });
                    if (!res.ok) { const err = await res.json(); alert(err.detail||'Failed'); return; }
                    this.showCheckoutModal = false; await this.refresh();
                } catch(e) { alert('Failed'); }
            },

            get availableForBulk() {
                const bulkMap = {};
                this.bulkForm.items.forEach(bi => { bulkMap[bi.item_id] = (bulkMap[bi.item_id]||0) + bi.quantity; });
                return this.items.filter(i => (i.quantityAvailable - (bulkMap[i.id]||0)) > 0);
            },
            openBulkCheckout() {
                this.bulkForm = { person_name: '', items: [] };
                this.bulkAddItemId = '';
                this.bulkAddQty = 1;
                this.showBulkModal = true;
                this.$nextTick(() => { if(this.$refs.bulkPersonName) this.$refs.bulkPersonName.focus(); });
            },
            addToBulk() {
                if (!this.bulkAddItemId) return;
                const item = this.items.find(i => i.id == this.bulkAddItemId);
                if (!item) return;
                const alreadyAdded = this.bulkForm.items.filter(bi => bi.item_id == item.id).reduce((s,bi) => s+bi.quantity, 0);
                const maxAvail = item.quantityAvailable - alreadyAdded;
                const qty = Math.min(Math.max(this.bulkAddQty || 1, 1), maxAvail);
                if (qty <= 0) { alert('No more available'); return; }
                this.bulkForm.items.push({ item_id: item.id, quantity: qty, _name: item.name, _category: item.category });
                this.bulkAddItemId = '';
                this.bulkAddQty = 1;
            },
            async submitBulkCheckout() {
                if (!this.bulkForm.person_name.trim()) { alert('Please enter a name.'); return; }
                if (this.bulkForm.items.length === 0) { alert('Add at least one item.'); return; }
                try {
                    const payload = { person_name: this.bulkForm.person_name, items: this.bulkForm.items.map(bi => ({ item_id: bi.item_id, quantity: bi.quantity })) };
                    const res = await fetch('/api/inventory/checkout-bulk', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                    if (!res.ok) { const err = await res.json(); alert(err.detail||'Failed'); return; }
                    this.showBulkModal = false; await this.refresh();
                } catch(e) { alert('Failed'); }
            },

            async returnCheckoutRecord(itemId, recordId, personName, qty) {
                if (!confirm(`Return ${qty} from ${personName}?`)) return;
                try {
                    const res = await fetch(`/api/inventory/items/${itemId}/return`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({record_id: recordId}) });
                    if (!res.ok) { const err = await res.json(); alert(err.detail||'Failed'); return; }
                    await this.refresh();
                } catch(e) { alert('Failed'); }
            },
            async returnAllForPerson(personName) {
                if (!confirm(`Return ALL items from ${personName}?`)) return;
                try {
                    const res = await fetch('/api/inventory/return-person', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({person_name: personName}) });
                    if (!res.ok) { const err = await res.json(); alert(err.detail||'Failed'); return; }
                    await this.refresh();
                } catch(e) { alert('Failed'); }
            },

            getCategoryEmoji(catName) { const cat = this.categories.find(c => c.name === catName); return cat ? cat.emoji : '📦'; },
            inventoryRows(item) {
                const rows = [{ _type: 'item', _key: 'hdr-' + item.id }];
                const sorted = (item.checkouts || []).slice().sort((a, b) => a.personName.localeCompare(b.personName));
                sorted.forEach(co => {
                    rows.push({ ...co, _type: 'checkout', _key: 'co-' + co.id });
                });
                return rows;
            },
            conditionColor(c) { return {'New':'bg-blue-100 text-blue-700','Good':'bg-green-100 text-green-700','Fair':'bg-yellow-100 text-yellow-700','Poor':'bg-orange-100 text-orange-700','Replace':'bg-red-100 text-red-700'}[c] || 'bg-gray-100 text-gray-600'; },
            formatDate(iso) {
                if(!iso) return '';
                const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
                const now = new Date();
                const pad = (n) => String(n);
                const toDateStr = (dt) => dt.getFullYear() + '-' + pad(dt.getMonth()) + '-' + pad(dt.getDate());
                const todayStr = toDateStr(now);
                const dateStr = toDateStr(d);
                const yesterday = new Date(now);
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = toDateStr(yesterday);
                const time = d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
                if (dateStr === todayStr) return 'Today, ' + time;
                if (dateStr === yesterdayStr) return 'Yesterday, ' + time;
                return d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ', ' + time;
            },
        }
    }
    </script>
</body>
</html>
