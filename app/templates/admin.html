<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - POSA Jersey App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --posa-green: #2d5016;
            --posa-gold: #c8aa6e;
            --pine-dark: #1a3a0f;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, var(--posa-green) 0%, var(--pine-dark) 100%);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--posa-gold) !important;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand::before {
            content: "🌲";
            font-size: 1.8rem;
        }

        .main-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-box {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }

        .search-box input {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .search-box .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: all 0.2s;
        }

        .search-box .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .clear-search {
            cursor: pointer;
            color: #dc3545;
            margin-left: 16px;
            font-weight: 600;
            transition: all 0.2s;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .clear-search:hover {
            background: #ffe5e8;
        }

        #view-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        #view-toggle .btn {
            border: 2px solid #e9ecef;
            background: white;
            color: #495057;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.2s;
        }

        #view-toggle .btn:hover {
            border-color: #667eea;
            background: #f0f2ff;
            color: #667eea;
        }

        #view-toggle .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        #view-toggle .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .nav-pills {
            gap: 8px;
            background: white;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .nav-pills .nav-link {
            border-radius: 12px;
            padding: 10px 20px;
            color: #495057;
            font-weight: 600;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .nav-pills .nav-link:hover {
            background: #f8f9fa;
            color: #667eea;
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .table {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 0;
        }

        .table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .table thead th {
            border: none;
            padding: 16px 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.2s;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }

        .table tbody tr:last-child {
            border-bottom: none;
        }

        .table tbody td {
            padding: 14px 12px;
            vertical-align: middle;
        }

        tr.locked td {
            color: #adb5bd;
            opacity: 0.6;
        }

        tr.locked .btn {
            pointer-events: none;
            opacity: 0.5;
        }

        tr.duplicate-jersey {
            background: #fff3cd !important;
            border-left: 4px solid #ffc107;
        }

        tr.waiting-room {
            background: #fff4e6 !important;
            border-left: 4px solid #ff9800;
        }

        .sport-tag {
            display: inline-block;
            padding: 4px 12px;
            margin: 2px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }

        .sport-checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .sport-checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .edit-sports {
            display: none;
        }

        /* OUTLINED GHOST BUTTON STYLES - OPTION 4 */
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 90px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            background: white;
        }

        .btn-edit {
            border-color: #6366f1;
            color: #6366f1;
        }

        .btn-edit:hover {
            background: #6366f1;
            color: white;
        }

        .btn-email {
            border-color: #0ea5e9;
            color: #0ea5e9;
        }

        .btn-email:hover {
            background: #0ea5e9;
            color: white;
        }

        .btn-email:disabled {
            border-color: #94a3b8;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-email.sent {
            border-color: #22c55e;
            color: #22c55e;
        }

        .btn-email.sent:hover {
            background: #22c55e;
            color: white;
        }

        .btn-delete {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-delete:hover {
            background: #ef4444;
            color: white;
            animation: shake 0.3s;
        }

        .btn-save {
            border-color: #22c55e;
            color: #22c55e;
        }

        .btn-save:hover {
            background: #22c55e;
            color: white;
        }

        .btn-cancel {
            border-color: #94a3b8;
            color: #94a3b8;
        }

        .btn-cancel:hover {
            background: #94a3b8;
            color: white;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .success-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
            font-weight: 600;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 8px 12px;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .form-select {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 8px 12px;
            transition: all 0.2s;
        }

        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .form-check-input {
            border: 2px solid #e9ecef;
            transition: all 0.2s;
        }

        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }

        .form-check-input:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .lock-switch {
            cursor: pointer;
            font-size: 1.2rem;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">POSA Jersey App</a>
        <div class="ms-auto">
            <a href="/logout" class="btn btn-outline-light">Logout</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <main>
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-players">0</div>
                <div class="stat-label">Total Athletes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="assigned-jerseys">0</div>
                <div class="stat-label">Jerseys Assigned</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="duplicate-count">0</div>
                <div class="stat-label">Duplicate Jerseys</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="waiting-count">0</div>
                <div class="stat-label">Waiting Room</div>
            </div>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="search-input" class="form-control" placeholder="🔍 Search by name, email, or jersey...">
                </div>
                <div class="col-md-3">
                    <select id="sport-filter" class="form-select">
                        <option value="">All Sports</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="division-filter" class="form-select">
                        <option value="">All Divisions</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button id="search-btn" class="btn btn-primary w-100">Search</button>
                </div>
            </div>
            <div id="search-status" style="margin-top: 12px; color: #64748b; font-weight: 500;"></div>
        </div>

        <!-- View Toggle -->
        <div id="view-toggle">
            <button class="btn btn-primary" data-view="birth-year">👶 Birth Year View</button>
            <button class="btn" data-view="division">🏆 Division View</button>
        </div>

        <!-- Birth Year View -->
        <div id="birth-year-view">
            <ul class="nav nav-pills" id="year-tabs" role="tablist"></ul>
            <div class="tab-content" id="year-content"></div>
        </div>

        <!-- Division View -->
        <div id="division-view" style="display: none;">
            <ul class="nav nav-pills" id="division-tabs" role="tablist"></ul>
            <div class="tab-content" id="division-content"></div>
        </div>

        <!-- Quick Add Section -->
        <div class="table-container mt-4">
            <h4 style="margin-bottom: 20px; color: #333; font-weight: 700;">➕ Quick Add Athlete</h4>
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="quick-name" class="form-control" placeholder="Full Name">
                </div>
                <div class="col-md-2">
                    <input type="number" id="quick-jersey" class="form-control" placeholder="Jersey #">
                </div>
                <div class="col-md-2">
                    <input type="number" id="quick-birth-year" class="form-control" placeholder="Birth Year">
                </div>
                <div class="col-md-2">
                    <input type="email" id="quick-email" class="form-control" placeholder="Email">
                </div>
                <div class="col-md-1">
                    <select id="quick-sport" class="form-select">
                        <option value="">Sport</option>
                        <option value="soccer">⚽ Soccer</option>
                        <option value="basketball">🏀 Basketball</option>
                        <option value="baseball">⚾ Baseball</option>
                        <option value="softball">🥎 Softball</option>
                        <option value="volleyball">🏐 Volleyball</option>
                        <option value="football">🏈 Football</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <input type="text" id="quick-division" class="form-control" placeholder="Division">
                </div>
                <div class="col-md-1">
                    <button id="quick-add-btn" class="btn btn-save w-100">💾 Add</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    let allPlayers = [];
    let currentView = 'birth-year';
    let searchActive = false;
    let searchResults = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        loadPlayers();
        setupViewToggle();
        setupSearch();
        setupQuickAdd();
    });

    function setupViewToggle() {
        document.querySelectorAll('#view-toggle .btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const view = this.dataset.view;
                currentView = view;

                document.querySelectorAll('#view-toggle .btn').forEach(b => b.classList.remove('btn-primary'));
                this.classList.add('btn-primary');

                if (view === 'birth-year') {
                    document.getElementById('birth-year-view').style.display = 'block';
                    document.getElementById('division-view').style.display = 'none';
                } else {
                    document.getElementById('birth-year-view').style.display = 'none';
                    document.getElementById('division-view').style.display = 'block';
                }

                if (searchActive) {
                    displaySearchResults();
                } else {
                    renderTables();
                }
            });
        });
    }

    function setupSearch() {
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const sportFilter = document.getElementById('sport-filter');
        const divisionFilter = document.getElementById('division-filter');

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Clear search functionality
        searchInput.addEventListener('input', function() {
            if (this.value === '') {
                clearSearch();
            }
        });
    }

    function performSearch() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const sport = document.getElementById('sport-filter').value;
        const division = document.getElementById('division-filter').value;

        if (!query && !sport && !division) {
            clearSearch();
            return;
        }

        searchResults = allPlayers.filter(player => {
            const matchesQuery = !query || 
                player.full_name.toLowerCase().includes(query) ||
                (player.parent_email && player.parent_email.toLowerCase().includes(query)) ||
                (player.jersey_number && player.jersey_number.toString().includes(query));

            const matchesSport = !sport || player.sport === sport;
            const matchesDivision = !division || player.division === division;

            return matchesQuery && matchesSport && matchesDivision;
        });

        searchActive = true;
        displaySearchResults();

        const statusDiv = document.getElementById('search-status');
        statusDiv.innerHTML = `Found ${searchResults.length} athlete(s). <span class="clear-search" onclick="clearSearch()">✖ Clear Search</span>`;
    }

    function clearSearch() {
        document.getElementById('search-input').value = '';
        document.getElementById('sport-filter').value = '';
        document.getElementById('division-filter').value = '';
        document.getElementById('search-status').innerHTML = '';
        searchActive = false;
        searchResults = [];
        renderTables();
    }

    function displaySearchResults() {
        if (currentView === 'birth-year') {
            const yearTabs = document.getElementById('year-tabs');
            const yearContent = document.getElementById('year-content');
            yearTabs.innerHTML = '<li class="nav-item"><a class="nav-link active" href="#">Search Results</a></li>';
            yearContent.innerHTML = `<div class="tab-pane fade show active">${generateTable(searchResults)}</div>`;
        } else {
            const divTabs = document.getElementById('division-tabs');
            const divContent = document.getElementById('division-content');
            divTabs.innerHTML = '<li class="nav-item"><a class="nav-link active" href="#">Search Results</a></li>';
            divContent.innerHTML = `<div class="tab-pane fade show active">${generateTable(searchResults)}</div>`;
        }
    }

    async function loadPlayers() {
        try {
            const response = await fetch('/players');
            allPlayers = await response.json();
            updateStats();
            populateFilters();
            renderTables();
        } catch (error) {
            console.error('Error loading players:', error);
        }
    }

    function updateStats() {
        const totalPlayers = allPlayers.length;
        const assignedJerseys = allPlayers.filter(p => p.jersey_number).length;
        
        const jerseyMap = new Map();
        allPlayers.forEach(player => {
            if (player.jersey_number) {
                const key = `${player.sport}-${player.division}-${player.jersey_number}`;
                if (!jerseyMap.has(key)) {
                    jerseyMap.set(key, []);
                }
                jerseyMap.get(key).push(player);
            }
        });
        
        let duplicateCount = 0;
        jerseyMap.forEach(players => {
            if (players.length > 1) {
                duplicateCount += players.length;
            }
        });

        const waitingCount = allPlayers.filter(p => p.in_waiting_room).length;

        document.getElementById('total-players').textContent = totalPlayers;
        document.getElementById('assigned-jerseys').textContent = assignedJerseys;
        document.getElementById('duplicate-count').textContent = duplicateCount;
        document.getElementById('waiting-count').textContent = waitingCount;
    }

    function populateFilters() {
        const sports = [...new Set(allPlayers.map(p => p.sport))].filter(Boolean);
        const divisions = [...new Set(allPlayers.map(p => p.division))].filter(Boolean);

        const sportFilter = document.getElementById('sport-filter');
        const divisionFilter = document.getElementById('division-filter');

        sports.forEach(sport => {
            const option = document.createElement('option');
            option.value = sport;
            option.textContent = sport;
            sportFilter.appendChild(option);
        });

        divisions.forEach(division => {
            const option = document.createElement('option');
            option.value = division;
            option.textContent = division;
            divisionFilter.appendChild(option);
        });
    }

    function renderTables() {
        if (currentView === 'birth-year') {
            renderBirthYearView();
        } else {
            renderDivisionView();
        }
    }

    function renderBirthYearView() {
        const yearGroups = {};
        allPlayers.forEach(player => {
            const year = player.birth_year || 'Unknown';
            if (!yearGroups[year]) yearGroups[year] = [];
            yearGroups[year].push(player);
        });

        const years = Object.keys(yearGroups).sort((a, b) => b - a);
        const yearTabs = document.getElementById('year-tabs');
        const yearContent = document.getElementById('year-content');

        yearTabs.innerHTML = '';
        yearContent.innerHTML = '';

        years.forEach((year, index) => {
            const tabId = `year-${year}`;
            const isActive = index === 0 ? 'active' : '';

            yearTabs.innerHTML += `
                <li class="nav-item">
                    <a class="nav-link ${isActive}" data-bs-toggle="tab" href="#${tabId}">${year} (${yearGroups[year].length})</a>
                </li>
            `;

            yearContent.innerHTML += `
                <div class="tab-pane fade ${isActive ? 'show active' : ''}" id="${tabId}">
                    ${generateTable(yearGroups[year])}
                </div>
            `;
        });
    }

    function renderDivisionView() {
        const divisionGroups = {};
        allPlayers.forEach(player => {
            const division = player.division || 'Unknown';
            if (!divisionGroups[division]) divisionGroups[division] = [];
            divisionGroups[division].push(player);
        });

        const divisions = Object.keys(divisionGroups).sort();
        const divTabs = document.getElementById('division-tabs');
        const divContent = document.getElementById('division-content');

        divTabs.innerHTML = '';
        divContent.innerHTML = '';

        divisions.forEach((division, index) => {
            const tabId = `div-${division}`;
            const isActive = index === 0 ? 'active' : '';

            divTabs.innerHTML += `
                <li class="nav-item">
                    <a class="nav-link ${isActive}" data-bs-toggle="tab" href="#${tabId}">${division} (${divisionGroups[division].length})</a>
                </li>
            `;

            divContent.innerHTML += `
                <div class="tab-pane fade ${isActive ? 'show active' : ''}" id="${tabId}">
                    ${generateTable(divisionGroups[division])}
                </div>
            `;
        });
    }

    function generateTable(players) {
        const duplicates = findDuplicateJerseys(players);

        let html = '<div class="table-container"><table class="table table-hover">';
        html += `
            <thead>
                <tr>
                    <th>🔒</th>
                    <th>Name</th>
                    <th>Jersey #</th>
                    <th>Birth Year</th>
                    <th>Email</th>
                    <th>Sport</th>
                    <th>Division</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
        `;

        players.forEach(player => {
            const isDuplicate = duplicates.has(`${player.sport}-${player.division}-${player.jersey_number}`);
            const isWaiting = player.in_waiting_room;
            let rowClass = '';
            if (player.is_locked) rowClass = 'locked';
            else if (isDuplicate && player.jersey_number) rowClass = 'duplicate-jersey';
            else if (isWaiting) rowClass = 'waiting-room';

            const emailStatus = player.email_sent ? '✅ Sent' : '';
            const emailBtnClass = player.email_sent ? 'btn-email sent' : 'btn-email';
            const emailBtnText = player.email_sent ? '✅ Sent' : '📧 Email';

            html += `
                <tr class="${rowClass}" data-player-id="${player.id}">
                    <td>
                        <span class="lock-switch" onclick="toggleLock(${player.id}, ${!player.is_locked})">
                            ${player.is_locked ? '🔒' : '🔓'}
                        </span>
                    </td>
                    <td class="player-name">${player.full_name}</td>
                    <td class="player-jersey">${player.jersey_number || '-'}</td>
                    <td class="player-birth-year">${player.birth_year || '-'}</td>
                    <td class="player-email">${player.parent_email || '-'}</td>
                    <td class="player-sport">
                        <span class="view-sports">${player.sport || '-'}</span>
                        <div class="edit-sports">
                            <select class="form-select form-select-sm sport-select">
                                <option value="">Select Sport</option>
                                <option value="soccer" ${player.sport === 'soccer' ? 'selected' : ''}>⚽ Soccer</option>
                                <option value="basketball" ${player.sport === 'basketball' ? 'selected' : ''}>🏀 Basketball</option>
                                <option value="baseball" ${player.sport === 'baseball' ? 'selected' : ''}>⚾ Baseball</option>
                                <option value="softball" ${player.sport === 'softball' ? 'selected' : ''}>🥎 Softball</option>
                                <option value="volleyball" ${player.sport === 'volleyball' ? 'selected' : ''}>🏐 Volleyball</option>
                                <option value="football" ${player.sport === 'football' ? 'selected' : ''}>🏈 Football</option>
                            </select>
                        </div>
                    </td>
                    <td class="player-division">
                        <span class="view-division">${player.division || '-'}</span>
                        <input type="text" class="form-control form-control-sm edit-division" value="${player.division || ''}" style="display: none;">
                    </td>
                    <td>${emailStatus}${isDuplicate && player.jersey_number ? '<br><span style="color: #f59e0b; font-weight: 600;">⚠️ Duplicate</span>' : ''}${isWaiting ? '<br><span style="color: #ff9800; font-weight: 600;">⏳ Waiting</span>' : ''}</td>
                    <td class="action-buttons">
                        <button class="btn btn-edit" onclick="editRow(this)">✏️ Edit</button>
                        <button class="btn ${emailBtnClass}" onclick="sendEmail(${player.id}, this)" ${player.email_sent ? 'disabled' : ''}>${emailBtnText}</button>
                        <button class="btn btn-delete" onclick="deletePlayer(${player.id})">⚠️ Delete</button>
                        <button class="btn btn-save" onclick="saveRow(this, ${player.id})" style="display: none;">💾 Save</button>
                        <button class="btn btn-cancel" onclick="cancelEdit(this)" style="display: none;">❌ Cancel</button>
                    </td>
                </tr>
            `;
        });

        html += '</tbody></table></div>';
        return html;
    }

    function findDuplicateJerseys(players) {
        const jerseyMap = new Map();
        const duplicates = new Set();

        players.forEach(player => {
            if (player.jersey_number) {
                const key = `${player.sport}-${player.division}-${player.jersey_number}`;
                if (jerseyMap.has(key)) {
                    duplicates.add(key);
                } else {
                    jerseyMap.set(key, player);
                }
            }
        });

        return duplicates;
    }

    function editRow(btn) {
        const row = btn.closest('tr');
        const cells = row.querySelectorAll('td');

        // Show edit mode
        row.querySelector('.view-sports').style.display = 'none';
        row.querySelector('.edit-sports').style.display = 'block';
        row.querySelector('.view-division').style.display = 'none';
        row.querySelector('.edit-division').style.display = 'block';

        // Make fields editable
        const nameCell = row.querySelector('.player-name');
        const jerseyCell = row.querySelector('.player-jersey');
        const birthYearCell = row.querySelector('.player-birth-year');
        const emailCell = row.querySelector('.player-email');

        nameCell.contentEditable = true;
        jerseyCell.contentEditable = true;
        birthYearCell.contentEditable = true;
        emailCell.contentEditable = true;

        nameCell.style.background = '#f0f2ff';
        jerseyCell.style.background = '#f0f2ff';
        birthYearCell.style.background = '#f0f2ff';
        emailCell.style.background = '#f0f2ff';

        // Toggle buttons
        btn.style.display = 'none';
        row.querySelector('.btn-email').style.display = 'none';
        row.querySelector('.btn-delete').style.display = 'none';
        row.querySelector('.btn-save').style.display = 'inline-flex';
        row.querySelector('.btn-cancel').style.display = 'inline-flex';
    }

    function cancelEdit(btn) {
        const row = btn.closest('tr');
        
        // Reset edit mode
        row.querySelector('.view-sports').style.display = 'inline';
        row.querySelector('.edit-sports').style.display = 'none';
        row.querySelector('.view-division').style.display = 'inline';
        row.querySelector('.edit-division').style.display = 'none';

        const nameCell = row.querySelector('.player-name');
        const jerseyCell = row.querySelector('.player-jersey');
        const birthYearCell = row.querySelector('.player-birth-year');
        const emailCell = row.querySelector('.player-email');

        nameCell.contentEditable = false;
        jerseyCell.contentEditable = false;
        birthYearCell.contentEditable = false;
        emailCell.contentEditable = false;

        nameCell.style.background = '';
        jerseyCell.style.background = '';
        birthYearCell.style.background = '';
        emailCell.style.background = '';

        // Toggle buttons
        btn.style.display = 'none';
        row.querySelector('.btn-save').style.display = 'none';
        row.querySelector('.btn-edit').style.display = 'inline-flex';
        row.querySelector('.btn-email').style.display = 'inline-flex';
        row.querySelector('.btn-delete').style.display = 'inline-flex';

        loadPlayers(); // Reload to reset data
    }

    async function saveRow(btn, playerId) {
        const row = btn.closest('tr');

        const fullName = row.querySelector('.player-name').textContent.trim();
        const jerseyNumber = row.querySelector('.player-jersey').textContent.trim();
        const birthYear = row.querySelector('.player-birth-year').textContent.trim();
        const parentEmail = row.querySelector('.player-email').textContent.trim();
        const sport = row.querySelector('.sport-select').value;
        const division = row.querySelector('.edit-division').value.trim();

        const payload = {
            full_name: fullName,
            jersey_number: jerseyNumber ? parseInt(jerseyNumber) : null,
            birth_year: birthYear ? parseInt(birthYear) : null,
            parent_email: parentEmail,
            sport: sport,
            division: division
        };

        try {
            const response = await fetch(`/players/${playerId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showSuccessNotification('✅ Player updated successfully!');
                await loadPlayers();
            } else {
                alert('Failed to update player');
            }
        } catch (error) {
            console.error('Error updating player:', error);
            alert('Error updating player');
        }
    }

    async function sendEmail(playerId, btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Sending...';

        try {
            const response = await fetch(`/players/${playerId}/email`, {
                method: 'POST'
            });

            if (response.ok) {
                showSuccessNotification('📧 Email sent successfully!');
                btn.textContent = '✅ Sent';
                btn.classList.remove('btn-email');
                btn.classList.add('btn-email', 'sent');
                await loadPlayers();
            } else {
                alert('Failed to send email');
                btn.disabled = false;
                btn.textContent = '📧 Email';
            }
        } catch (error) {
            console.error('Error sending email:', error);
            alert('Error sending email');
            btn.disabled = false;
            btn.textContent = '📧 Email';
        }
    }

    async function deletePlayer(playerId) {
        if (!confirm('Are you sure you want to delete this athlete?')) {
            return;
        }

        try {
            const response = await fetch(`/players/${playerId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showSuccessNotification('🗑️ Player deleted successfully!');
                await loadPlayers();
            } else {
                alert('Failed to delete player');
            }
        } catch (error) {
            console.error('Error deleting player:', error);
            alert('Error deleting player');
        }
    }

    async function toggleLock(playerId, isLocked) {
        try {
            const response = await fetch(`/players/${playerId}/lock`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_locked: isLocked })
            });

            if (response.ok) {
                await loadPlayers();
            }
        } catch (error) {
            console.error('Error toggling lock:', error);
        }
    }

    function showSuccessNotification(message) {
        const notification = document.createElement('div');
        notification.className = 'success-notification';
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(() => {
            notification.remove();
        }, 3000);
    }

    function setupQuickAdd() {
        document.getElementById('quick-add-btn').addEventListener('click', async function() {
            const fullName = document.getElementById('quick-name').value.trim();
            const jerseyNumber = document.getElementById('quick-jersey').value.trim();
            const birthYear = document.getElementById('quick-birth-year').value.trim();
            const parentEmail = document.getElementById('quick-email').value.trim();
            const sport = document.getElementById('quick-sport').value;
            const division = document.getElementById('quick-division').value.trim();

            if (!fullName) {
                alert('Please enter a name');
                return;
            }

            const payload = {
                full_name: fullName,
                jersey_number: jerseyNumber ? parseInt(jerseyNumber) : null,
                birth_year: birthYear ? parseInt(birthYear) : null,
                parent_email: parentEmail,
                sport: sport,
                division: division,
                season: new Date().getFullYear().toString()
            };

            const response = await fetch('/players/inline', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showSuccessNotification('✅ Athlete added successfully!');
                document.getElementById('quick-name').value = '';
                document.getElementById('quick-jersey').value = '';
                document.getElementById('quick-birth-year').value = '';
                document.getElementById('quick-email').value = '';
                document.getElementById('quick-sport').value = '';
                document.getElementById('quick-division').value = '';
                await loadPlayers();
            } else {
                alert('Failed to add player');
            }
        });
    }
</script>
