<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-50" x-data="membersApp()" x-init="init()" x-cloak>

    <!-- Filters -->
    <div class="bg-white border-b border-gray-200" x-data="{ showMore: false }">
        <div class="px-6 py-2.5 flex items-center gap-2 flex-wrap">
            <span class="text-xs text-gray-600 mr-1" x-text="filteredMembers.length + ' members'"></span>
            <!-- Search -->
            <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="search" x-model="filters.search" @input.debounce.300ms="applyFilters()" placeholder="Search..."
                       class="pl-8 pr-3 py-1.5 border border-gray-200 rounded-md text-xs w-44 focus:ring-1 focus:ring-pines-500 focus:border-pines-500 placeholder-gray-400">
            </div>
            <!-- All filter pills (behind + Filter) -->
            <template x-if="showMore || hasAnyFilter()">
                <div class="contents">
                    <!-- Type pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.type.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="typeLabel()"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg py-1">
                            <template x-for="t in [{val:'child',label:'Children'},{val:'adult',label:'Adults'}]" :key="t.val">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.type.includes(t.val)"
                                           @change="toggleFilter('type', t.val)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="t.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Sport pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.sport.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.sport, 'sport', 'sports')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="sp in availableSports" :key="sp">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.sport.includes(sp)"
                                           @change="toggleFilter('sport', sp)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="sp"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Season pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }" x-show="availableSeasons.length > 0">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.season.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.season, 'season', 'seasons')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-40 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="s in availableSeasons" :key="s">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.season.includes(s)"
                                           @change="toggleFilter('season', s)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="s"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Gender pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }" x-show="availableGenders.length > 0">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.gender.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.gender, 'gender', 'genders')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="g in availableGenders" :key="g">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.gender.includes(g)"
                                           @change="toggleFilter('gender', g)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="g"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- City pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.city.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.city, 'city', 'cities')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="c in availableCities" :key="c">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.city.includes(c)"
                                           @change="toggleFilter('city', c)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="c"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Grad Year pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }" x-show="availableGradYears.length > 0">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.gradYear.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.gradYear, 'grad year', 'grad years')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="y in availableGradYears" :key="y">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.gradYear.map(String).includes(String(y))"
                                           @change="toggleFilter('gradYear', y)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="y"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Collapse filters -->
                    <button x-show="showMore && !hasAnyFilter()"
                            @click="showMore = false"
                            class="text-xs text-gray-400 hover:text-gray-600 px-1 py-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </template>
            <!-- + Filter toggle -->
            <button x-show="!showMore && !hasAnyFilter()"
                    @click="showMore = true"
                    class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border border-dashed border-gray-300 text-gray-400 hover:text-gray-600 hover:border-gray-400 transition-colors">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Filter
            </button>
            <!-- Clear -->
            <button x-show="filters.search || hasAnyFilter()"
                    @click="clearFilters(); showMore = false" class="text-xs text-gray-400 hover:text-gray-600 px-1.5 py-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <!-- Spacer + actions -->
            <div class="ml-auto flex items-center gap-2">
                <button @click="syncMembers()" :disabled="syncing"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium border transition-colors"
                        :class="syncing ? 'border-gray-200 text-gray-400 cursor-wait' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                    <i class="fa-solid fa-arrows-rotate text-xs" :class="syncing && 'animate-spin'"></i>
                    <span x-text="syncing ? 'Syncing...' : 'Sync'"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="bg-white px-6 pt-4">
        <div x-show="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
            <p class="mt-2 text-gray-600">Loading members...</p>
        </div>

        <div x-show="!loading">
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th x-show="ecv('member')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Member</th>
                            <th x-show="ecv('jersey')" class="px-4 py-2.5 text-center text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Jersey</th>
                            <th x-show="ecv('email')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Email</th>
                            <th x-show="ecv('phone')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Phone</th>
                            <th x-show="ecv('registrations')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Registrations</th>
                            <th x-show="ecv('guardians')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Guardians</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="item in displayList" :key="item._key">
                            <tr :class="item._isHeader ? 'bg-gray-100/70 border-t border-gray-200' : (selectedMember && selectedMember.id === item.id ? 'bg-pines-50/50 cursor-pointer transition-colors border-b border-gray-100' : 'hover:bg-gray-50 cursor-pointer transition-colors border-b border-gray-100')"
                                @click="!item._isHeader && openPanel(item)">

                                <!-- Letter header row -->
                                <template x-if="item._isHeader">
                                    <td :colspan="visibleCount" class="px-4 py-2.5">
                                        <span class="text-sm font-bold text-gray-900" x-text="item._letter"></span>
                                        <span class="ml-2 text-xs text-gray-500 font-normal" x-text="item._count + ' members'"></span>
                                    </td>
                                </template>

                                <!-- Member name -->
                                <template x-if="!item._isHeader && ecv('member')">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <div class="text-sm font-medium text-gray-900" x-text="displayName(item)"></div>
                                        <div class="text-xs text-gray-500" x-show="item.dateOfBirth" x-text="formatDob(item.dateOfBirth)"></div>
                                    </td>
                                </template>
                                <!-- Jersey -->
                                <template x-if="!item._isHeader && ecv('jersey')">
                                    <td class="px-4 py-3 text-center whitespace-nowrap">
                                        <span x-show="item.player && item.player.jerseyNumber" class="text-sm text-gray-900" x-text="item.player ? item.player.jerseyNumber : ''"></span>
                                        <span x-show="!item.player || !item.player.jerseyNumber" class="text-sm text-gray-300">-</span>
                                    </td>
                                </template>
                                <!-- Email -->
                                <template x-if="!item._isHeader && ecv('email')">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <div class="text-sm text-gray-900" x-text="item.email || '-'"></div>
                                    </td>
                                </template>
                                <!-- Phone -->
                                <template x-if="!item._isHeader && ecv('phone')">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <div class="text-sm text-gray-900" x-text="formatPhone(item.phone) || '-'"></div>
                                    </td>
                                </template>
                                <!-- Registrations -->
                                <template x-if="!item._isHeader && ecv('registrations')">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <template x-if="item.player && item.player.registrations && item.player.registrations.length > 0">
                                            <div class="flex flex-nowrap gap-1">
                                                <template x-for="reg in sortedRegs(item.player.registrations)" :key="reg.id">
                                                    <span class="inline-flex items-center px-1.5 py-0.5 text-xs rounded cursor-default"
                                                          :class="sportColor(reg.sport)"
                                                          :title="reg.sport + ' \u2013 ' + reg.season + ' (' + reg.division + ')'">
                                                        <span x-text="sportEmoji(reg.sport)"></span>
                                                        <span class="ml-0.5" x-text="shortSeason(reg.season)"></span>
                                                    </span>
                                                </template>
                                            </div>
                                        </template>
                                        <template x-if="!item.player || !item.player.registrations || item.player.registrations.length === 0">
                                            <span class="text-sm text-gray-300">-</span>
                                        </template>
                                    </td>
                                </template>
                                <!-- Guardians -->
                                <template x-if="!item._isHeader && ecv('guardians')">
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <template x-if="item.guardians && item.guardians.length > 0">
                                            <div class="flex flex-wrap gap-0.5">
                                                <template x-for="g in item.guardians" :key="g.id">
                                                    <span class="inline-flex items-center px-1.5 py-0.5 text-xs rounded bg-blue-50 text-blue-700" x-text="g.firstName + ' ' + g.lastName.charAt(0) + '.'"></span>
                                                </template>
                                            </div>
                                        </template>
                                        <template x-if="!item.guardians || item.guardians.length === 0">
                                            <span class="text-sm text-gray-300">-</span>
                                        </template>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div x-show="filteredMembers.length === 0 && !loading" class="text-center py-12">
                <div class="text-gray-400 text-5xl mb-3"><i class="fa-solid fa-users"></i></div>
                <h3 class="text-lg font-medium text-gray-900 mb-1">No members found</h3>
                <p class="text-gray-500" x-show="allMembers.length === 0">Click "Sync Members" to pull data from SportsEngine</p>
                <p class="text-gray-500" x-show="allMembers.length > 0">Try adjusting your filters</p>
            </div>
        </div>
    </main>

    <!-- Detail Side Panel -->
    <div x-show="panelOpen" x-cloak class="fixed inset-0 z-30" @click.self="closePanel()">
        <div x-show="panelOpen"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
             class="absolute top-0 right-0 h-full w-full sm:w-96 bg-white border-l border-gray-200 shadow-lg flex flex-col">
            <!-- Panel header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 flex-shrink-0">
                <h2 class="text-lg font-semibold text-gray-900 truncate" x-text="selectedMember ? displayName(selectedMember) : 'Member Details'"></h2>
                <button @click="closePanel()" class="p-1 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <!-- Panel body -->
            <template x-if="selectedMember">
            <div class="flex-1 overflow-y-auto px-6 py-5 space-y-5">
                <!-- Profile -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Profile</label>
                    <div class="space-y-1.5">
                        <div class="text-sm font-medium text-gray-900" x-text="displayName(selectedMember)"></div>
                        <div class="text-xs text-gray-500" x-show="selectedMember.preferredName" x-text="'Goes by ' + selectedMember.preferredName"></div>
                        <template x-if="selectedMember.dateOfBirth">
                            <div class="text-xs text-gray-700">
                                <span x-text="formatDob(selectedMember.dateOfBirth)"></span>
                                <span class="text-gray-400 ml-1" x-text="'(' + age(selectedMember.dateOfBirth) + ' yrs)'"></span>
                            </div>
                        </template>
                        <div class="text-xs text-gray-700" x-show="selectedMember.gender" x-text="selectedMember.gender"></div>
                        <div class="text-xs text-gray-700" x-show="selectedMember.graduationYear" x-text="'Class of ' + selectedMember.graduationYear"></div>
                    </div>
                </div>

                <!-- Jersey & Registrations -->
                <template x-if="selectedMember.player">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Jersey & Registrations</label>
                        <div class="grid grid-cols-2 gap-4 mb-3">
                            <div>
                                <div class="text-xs text-gray-500">Jersey #</div>
                                <div class="text-sm font-medium text-gray-900" x-text="selectedMember.player.jerseyNumber || 'None'"></div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Status</div>
                                <div class="text-xs" :class="selectedMember.player.locked ? 'text-pines-600' : 'text-gray-400'" x-text="selectedMember.player.locked ? 'Locked' : 'Unlocked'"></div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <template x-for="reg in sortedRegs(selectedMember.player.registrations || [])" :key="reg.id">
                                <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg">
                                    <div class="flex items-center gap-2">
                                        <span class="inline-flex items-center px-2 py-0.5 text-xs rounded-full" :class="sportColor(reg.sport)">
                                            <span x-text="sportEmoji(reg.sport)"></span>
                                            <span class="ml-1" x-text="reg.sport"></span>
                                        </span>
                                        <span class="text-xs text-gray-700" x-text="reg.season"></span>
                                    </div>
                                    <span class="text-xs text-gray-600" x-text="reg.division"></span>
                                </div>
                            </template>
                            <div x-show="!selectedMember.player.registrations || selectedMember.player.registrations.length === 0" class="text-sm text-gray-400 italic">No registrations</div>
                        </div>
                    </div>
                </template>

                <!-- Contact -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Contact</label>
                    <div class="space-y-1">
                        <div class="text-sm text-gray-900" x-show="selectedMember.email" x-text="selectedMember.email"></div>
                        <div class="text-sm text-gray-900" x-show="selectedMember.phone" x-text="formatPhone(selectedMember.phone)"></div>
                        <div x-show="!selectedMember.email && !selectedMember.phone" class="text-sm text-gray-400 italic">No contact info</div>
                    </div>
                </div>

                <!-- Address -->
                <template x-if="selectedMember.address">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Address</label>
                        <div class="text-sm text-gray-900 space-y-0.5">
                            <div x-show="selectedMember.address.address1" x-text="selectedMember.address.address1"></div>
                            <div x-show="selectedMember.address.address2" x-text="selectedMember.address.address2"></div>
                            <div>
                                <span x-text="selectedMember.address.city"></span><span x-show="selectedMember.address.city && selectedMember.address.state">, </span>
                                <span x-text="selectedMember.address.state"></span>
                                <span class="ml-1" x-text="selectedMember.address.postalCode"></span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Guardians -->
                <template x-if="selectedMember.guardians && selectedMember.guardians.length > 0">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Parents / Guardians</label>
                        <div class="space-y-2">
                            <template x-for="g in selectedMember.guardians" :key="g.id">
                                <div class="p-2.5 bg-gray-50 rounded-lg">
                                    <div class="text-sm font-medium text-gray-900" x-text="g.firstName + ' ' + g.lastName"></div>
                                    <div class="text-xs text-gray-500 capitalize" x-show="g.type" x-text="g.type"></div>
                                    <div class="mt-1 space-y-0.5">
                                        <div class="text-xs text-gray-700" x-show="g.email" x-text="g.email"></div>
                                        <div class="text-xs text-gray-700" x-show="g.phone" x-text="formatPhone(g.phone)"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Memberships -->
                <template x-if="selectedMember.memberships">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Memberships</label>
                        <div class="flex flex-wrap gap-1">
                            <template x-for="m in selectedMember.memberships.split(', ')" :key="m">
                                <span class="inline-flex items-center px-2 py-0.5 text-xs rounded-full bg-pines-50 text-pines-700" x-text="m"></span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
            </template>
        </div>
    </div>

    <script src="/static/column-config.js"></script>
    <script>
    function membersApp() {
        return {
            loading: true,
            syncing: false,
            panelOpen: false,
            allMembers: [],
            filteredMembers: [],
            displayList: [],
            selectedMember: null,
            filters: { search: '', type: [], sport: [], season: [], gender: [], city: [], gradYear: [] },
            availableCities: [],
            availableSports: [],
            availableSeasons: [],
            availableGenders: [],
            availableGradYears: [],
            colVis: {},
            _filterColMap: {},

            get visibleCount() {
                var n = 0;
                var cols = ['member', 'jersey', 'email', 'phone', 'registrations', 'guardians'];
                for (var i = 0; i < cols.length; i++) {
                    if (this.ecv(cols[i])) n++;
                }
                return n;
            },

            ecv(colId) {
                if (this.colVis[colId] !== undefined && this.colVis[colId]) return true;
                var fKeys = Object.keys(this._filterColMap);
                for (var i = 0; i < fKeys.length; i++) {
                    if (this._filterColMap[fKeys[i]] === colId) {
                        var v = this.filters[fKeys[i]];
                        if (Array.isArray(v) ? v.length > 0 : !!v) return true;
                    }
                }
                return this.colVis[colId] !== undefined ? this.colVis[colId] : true;
            },

            async init() {
                this.colVis = window.POSA_COLUMNS.load('members');
                await this.loadMembers();
                this.loading = false;
            },

            async loadMembers() {
                try {
                    const response = await fetch('/api/members');
                    const data = await response.json();
                    this.allMembers = data.members;
                    this.buildFilterOptions();
                    this.applyFilters();
                } catch (error) {
                    console.error('Failed to load members:', error);
                }
            },

            buildFilterOptions() {
                const cities = new Set();
                const sports = new Set();
                const seasons = new Set();
                const genders = new Set();
                const gradYears = new Set();
                this.allMembers.forEach(m => {
                    if (m.address && m.address.city) cities.add(m.address.city);
                    if (m.gender) genders.add(m.gender);
                    if (m.graduationYear) gradYears.add(m.graduationYear);
                    if (m.player && m.player.registrations) {
                        m.player.registrations.forEach(r => {
                            if (r.sport && r.sport.toLowerCase() !== 'unknown') sports.add(r.sport);
                            if (r.season && r.season.toLowerCase() !== 'unknown' && /[a-z]/i.test(r.season)) seasons.add(r.season);
                        });
                    }
                });
                this.availableCities = [...cities].sort();
                this.availableSports = [...sports].sort();
                this.availableSeasons = [...seasons].sort();
                this.availableGenders = [...genders].sort();
                this.availableGradYears = [...gradYears].sort((a, b) => b - a);
            },

            hasAnyFilter() {
                return this.filters.type.length || this.filters.sport.length || this.filters.season.length || this.filters.gender.length || this.filters.city.length || this.filters.gradYear.length;
            },

            toggleFilter(filterKey, value) {
                const arr = this.filters[filterKey];
                const idx = arr.indexOf(value);
                if (idx >= 0) arr.splice(idx, 1);
                else arr.push(value);
                this.applyFilters();
            },

            filterLabel(arr, singular, plural) {
                if (arr.length === 0) return 'All ' + plural;
                if (arr.length === 1) return arr[0];
                return arr.length + ' ' + plural;
            },

            typeLabel() {
                if (this.filters.type.length === 0) return 'All types';
                const map = { child: 'Children', adult: 'Adults' };
                if (this.filters.type.length === 1) return map[this.filters.type[0]] || this.filters.type[0];
                return this.filters.type.length + ' types';
            },

            applyFilters() {
                this.filteredMembers = this.allMembers.filter(m => {
                    if (this.filters.search) {
                        const s = this.filters.search.toLowerCase();
                        const name = (m.firstName + ' ' + m.lastName).toLowerCase();
                        const email = (m.email || '').toLowerCase();
                        const phone = (m.phone || '');
                        const jersey = m.player && m.player.jerseyNumber ? String(m.player.jerseyNumber) : '';
                        const guardianMatch = (m.guardians || []).some(g =>
                            (g.firstName + ' ' + g.lastName).toLowerCase().includes(s) ||
                            (g.email || '').toLowerCase().includes(s) ||
                            (g.phone || '').includes(s)
                        );
                        if (!name.includes(s) && !email.includes(s) && !phone.includes(s) && !jersey.includes(s) && !guardianMatch) return false;
                    }
                    if (this.filters.type.length > 0) {
                        const isChild = m.isChild;
                        const ok = this.filters.type.some(t => (t === 'child' && isChild) || (t === 'adult' && !isChild));
                        if (!ok) return false;
                    }
                    if (this.filters.sport.length > 0 || this.filters.season.length > 0) {
                        const regs = m.player && m.player.registrations ? m.player.registrations : [];
                        if (regs.length === 0) return false;
                        const matchingReg = regs.some(r => {
                            if (this.filters.sport.length > 0 && !this.filters.sport.includes(r.sport)) return false;
                            if (this.filters.season.length > 0 && !this.filters.season.includes(r.season)) return false;
                            return true;
                        });
                        if (!matchingReg) return false;
                    }
                    if (this.filters.gender.length > 0) {
                        if (!m.gender || !this.filters.gender.includes(m.gender)) return false;
                    }
                    if (this.filters.city.length > 0) {
                        if (!m.address || !this.filters.city.includes(m.address.city)) return false;
                    }
                    if (this.filters.gradYear.length > 0) {
                        if (!m.graduationYear || !this.filters.gradYear.map(String).includes(String(m.graduationYear))) return false;
                    }
                    return true;
                });
                this.buildDisplayList();
            },

            buildDisplayList() {
                this.displayList = [];
                let lastLetter = null;
                const letterCounts = {};

                this.filteredMembers.forEach(m => {
                    const letter = (m.lastName || '?').charAt(0).toUpperCase();
                    letterCounts[letter] = (letterCounts[letter] || 0) + 1;
                });

                this.filteredMembers.forEach(m => {
                    const letter = (m.lastName || '?').charAt(0).toUpperCase();
                    if (letter !== lastLetter) {
                        this.displayList.push({
                            _isHeader: true,
                            _key: 'h-' + letter,
                            _letter: letter,
                            _count: letterCounts[letter] || 0,
                        });
                        lastLetter = letter;
                    }
                    this.displayList.push({ ...m, _isHeader: false, _key: 'm-' + m.id });
                });
            },

            openPanel(member) {
                this.selectedMember = { ...member };
                this.panelOpen = true;
            },

            closePanel() {
                this.panelOpen = false;
                this.selectedMember = null;
            },

            clearFilters() {
                this.filters = { search: '', type: [], sport: [], season: [], gender: [], city: [], gradYear: [] };
                this.applyFilters();
            },

            displayName(m) {
                let name = m.firstName;
                if (m.preferredName) name = m.preferredName;
                name += ' ' + m.lastName;
                if (m.suffix) name += ' ' + m.suffix;
                return name;
            },

            initials(m) {
                return ((m.firstName || '?').charAt(0) + (m.lastName || '?').charAt(0)).toUpperCase();
            },

            formatDob(dob) {
                if (!dob) return '';
                try {
                    const d = new Date(dob);
                    if (isNaN(d)) return dob;
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                } catch { return dob; }
            },

            age(dob) {
                if (!dob) return '';
                try {
                    const d = new Date(dob);
                    if (isNaN(d)) return '';
                    const now = new Date();
                    let a = now.getFullYear() - d.getFullYear();
                    if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) a--;
                    return a;
                } catch { return ''; }
            },

            formatPhone(phone) {
                if (!phone) return '';
                const digits = phone.replace(/\D/g, '');
                if (digits.length === 10) {
                    return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6);
                }
                if (digits.length === 11 && digits.startsWith('1')) {
                    return '(' + digits.slice(1,4) + ') ' + digits.slice(4,7) + '-' + digits.slice(7);
                }
                return phone;
            },

            // Sport display helpers (matching players_page.html)
            sportEmoji(sport) {
                const map = { 'Soccer': '\u26bd', 'Basketball': '\ud83c\udfc0', 'Flag Football': '\ud83c\udfc8', 'Volleyball': '\ud83c\udfd0', 'Baseball': '\u26be', 'Softball': '\ud83e\udd4e' };
                return map[sport] || '\ud83c\udfc3';
            },

            shortSeason(season) {
                if (!season) return '';
                const abbrevs = { 'spring': 'Spr', 'summer': 'Sum', 'fall': 'Fall', 'winter': 'Win' };
                const parts = season.split(' ');
                if (parts.length === 2) {
                    const word = parts[0].toLowerCase();
                    const yr = parts[1].length === 4 ? "'" + parts[1].slice(2) : parts[1];
                    return (abbrevs[word] || parts[0]) + ' ' + yr;
                }
                return season;
            },

            sportColor(sport) {
                if (sport === 'Soccer') return 'bg-green-50 text-green-700';
                if (sport === 'Basketball') return 'bg-orange-50 text-orange-700';
                if (sport === 'Flag Football') return 'bg-yellow-50 text-yellow-700';
                if (sport === 'Volleyball') return 'bg-purple-50 text-purple-700';
                return 'bg-blue-50 text-blue-700';
            },

            sortedRegs(regs) {
                const seasonOrder = { 'spring': 5, 'summer': 4, 'fall': 2, 'winter': 1 };
                return [...regs].sort((a, b) => {
                    const yearA = parseInt((a.season || '').match(/\d{4}/)?.[0] || 0);
                    const yearB = parseInt((b.season || '').match(/\d{4}/)?.[0] || 0);
                    if (yearB !== yearA) return yearB - yearA;
                    const wordA = (a.season || '').split(' ')[0].toLowerCase();
                    const wordB = (b.season || '').split(' ')[0].toLowerCase();
                    return (seasonOrder[wordB] || 3) - (seasonOrder[wordA] || 3);
                });
            },

            async syncMembers() {
                if (!confirm('Sync members directory from SportsEngine? This may take several minutes.')) return;
                this.syncing = true;
                try {
                    const response = await fetch('/api/members/sync', { method: 'POST' });
                    const data = await response.json();
                    if (data.status === 'started' || data.status === 'already_running') {
                        this._pollSync();
                    } else {
                        alert('Sync failed: ' + (data.detail || 'Unknown error'));
                        this.syncing = false;
                    }
                } catch (error) {
                    console.error('Sync failed:', error);
                    alert('Sync failed: ' + error.message);
                    this.syncing = false;
                }
            },

            async _pollSync() {
                try {
                    const response = await fetch('/api/members/sync-status');
                    const data = await response.json();
                    if (data.status === 'running') {
                        setTimeout(() => this._pollSync(), 3000);
                    } else if (data.status === 'success') {
                        this.syncing = false;
                        alert(`Sync complete!\n\nNew: ${data.new_members}\nUpdated: ${data.updated_members}\nGuardians: ${data.guardians_added}\nSkipped (existing): ${data.skipped_existing || 0}`);
                        await this.loadMembers();
                    } else if (data.status === 'error') {
                        this.syncing = false;
                        alert('Sync failed: ' + (data.detail || 'Unknown error'));
                    } else {
                        this.syncing = false;
                    }
                } catch (error) {
                    console.error('Poll failed:', error);
                    setTimeout(() => this._pollSync(), 5000);
                }
            },
        }
    }
    </script>
    <script src="/static/sidebar.js"></script>
</body>
</html>
