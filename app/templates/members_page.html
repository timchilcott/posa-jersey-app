<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Members</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50" x-data="membersApp()" x-init="init()" x-cloak>

    <!-- Filter bar -->
    <div class="bg-white border-b border-gray-200" x-data="{ showMore: false }">
        <div class="flex items-center gap-2 flex-nowrap px-6 py-2.5">
            <span class="text-xs text-gray-400 mr-1 shrink-0" x-text="filteredMembers.length + ' members'"></span>
            <!-- Search -->
            <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="search" x-model="filters.search" @input.debounce.300ms="applyFilters()" placeholder="Search..."
                       class="pl-8 pr-3 py-1.5 border border-gray-200 rounded-md text-xs w-48 focus:ring-1 focus:ring-pines-500 focus:border-pines-500 placeholder-gray-400">
            </div>
            <!-- All filter pills (behind + Filter) -->
            <template x-if="showMore || filters.type || filters.city">
                <div class="contents">
                    <!-- Type pill -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.type ? 'border-pines-200 bg-pines-50 text-pines-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                            <span x-text="filters.type === 'child' ? 'Children' : filters.type === 'adult' ? 'Adults' : 'All types'"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg py-1">
                            <div @click="filters.type = ''; applyFilters(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs text-gray-500">All types</div>
                            <div @click="filters.type = 'child'; applyFilters(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs" :class="filters.type === 'child' ? 'bg-pines-50 text-pines-700 font-medium' : ''">Children</div>
                            <div @click="filters.type = 'adult'; applyFilters(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs" :class="filters.type === 'adult' ? 'bg-pines-50 text-pines-700 font-medium' : ''">Adults</div>
                        </div>
                    </div>
                    <!-- City pill -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.city ? 'border-pines-200 bg-pines-50 text-pines-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                            <span x-text="filters.city || 'All cities'"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <div @click="filters.city = ''; applyFilters(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs text-gray-500">All cities</div>
                            <template x-for="c in availableCities" :key="c">
                                <div @click="filters.city = c; applyFilters(); open = false" class="px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs" :class="filters.city === c ? 'bg-pines-50 text-pines-700 font-medium' : ''" x-text="c"></div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
            <!-- + Filter button -->
            <template x-if="!showMore && !filters.type && !filters.city">
                <button @click="showMore = true" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border border-gray-200 text-gray-600 hover:bg-gray-50">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Filter
                </button>
            </template>
            <!-- Clear -->
            <template x-if="filters.search || filters.type || filters.city">
                <button @click="clearFilters()" class="px-2 py-1.5 text-xs text-gray-400 hover:text-gray-600">Clear</button>
            </template>
            <!-- Spacer -->
            <div class="flex-1"></div>
            <!-- Sync button -->
            <button @click="syncMembers()" :disabled="syncing"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium border transition-colors"
                    :class="syncing ? 'border-gray-200 text-gray-400 cursor-wait' : 'border-pines-200 bg-pines-50 text-pines-700 hover:bg-pines-100'">
                <i class="fa-solid fa-arrows-rotate text-xs" :class="syncing && 'animate-spin'"></i>
                <span x-text="syncing ? 'Syncing...' : 'Sync Members'"></span>
            </button>
        </div>
    </div>

    <!-- Main Content: Table + Sidebar -->
    <div class="flex" style="height: calc(100vh - 42px);">

        <!-- Member List (left) -->
        <div class="flex-1 overflow-y-auto" :class="selectedMember ? 'border-r border-gray-200' : ''">
            <div x-show="loading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
                <p class="mt-2 text-gray-600 text-sm">Loading members...</p>
            </div>

            <div x-show="!loading">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0 z-[5]">
                        <tr>
                            <th class="w-64 px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="w-16 px-4 py-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Jersey</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">City</th>
                            <th class="w-32 px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Guardians</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="item in displayList" :key="item._key">
                            <tr :class="item._isHeader
                                ? 'bg-pines-50 border-t-2 border-pines-200'
                                : (selectedMember && selectedMember.id === item.id ? 'bg-pines-50 cursor-pointer' : 'hover:bg-gray-50 cursor-pointer')"
                                @click="!item._isHeader && selectMember(item)">

                                <!-- Letter header row -->
                                <template x-if="item._isHeader">
                                    <td colspan="6" class="px-4 py-1.5">
                                        <span class="text-xs font-bold text-pines-700" x-text="item._letter"></span>
                                        <span class="ml-2 text-xs text-pines-500" x-text="item._count + ' members'"></span>
                                    </td>
                                </template>

                                <!-- Data rows -->
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-2">
                                        <div class="flex items-center">
                                            <div class="flex-shrink-0 h-7 w-7 rounded-full bg-pines-100 flex items-center justify-center text-pines-700 text-[10px] font-bold" x-text="initials(item)"></div>
                                            <div class="ml-2.5">
                                                <div class="text-xs font-medium text-gray-900" x-text="displayName(item)"></div>
                                                <div class="text-[10px] text-gray-400" x-show="item.dateOfBirth" x-text="formatDob(item.dateOfBirth)"></div>
                                            </div>
                                        </div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-2 text-center">
                                        <template x-if="item.player && item.player.jerseyNumber">
                                            <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-pines-100 text-pines-700 text-xs font-bold" x-text="item.player.jerseyNumber"></span>
                                        </template>
                                        <template x-if="!item.player || !item.player.jerseyNumber">
                                            <span class="text-[10px] text-gray-300">—</span>
                                        </template>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-2">
                                        <div class="text-xs text-gray-600 truncate max-w-48" x-text="item.email || '-'"></div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-2">
                                        <div class="text-xs text-gray-600" x-text="formatPhone(item.phone) || '-'"></div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-2">
                                        <div class="text-xs text-gray-600" x-text="item.address ? item.address.city || '-' : '-'"></div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-2">
                                        <template x-if="item.guardians && item.guardians.length > 0">
                                            <div class="flex flex-wrap gap-0.5">
                                                <template x-for="g in item.guardians" :key="g.id">
                                                    <span class="inline-flex items-center px-1.5 py-0.5 text-[10px] rounded bg-blue-50 text-blue-700" x-text="g.firstName + ' ' + g.lastName.charAt(0) + '.'"></span>
                                                </template>
                                            </div>
                                        </template>
                                        <template x-if="!item.guardians || item.guardians.length === 0">
                                            <span class="text-[10px] text-gray-400">-</span>
                                        </template>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div x-show="filteredMembers.length === 0 && !loading" class="text-center py-12">
                    <div class="text-gray-400 text-4xl mb-3"><i class="fa-solid fa-users"></i></div>
                    <h3 class="text-sm font-medium text-gray-900 mb-1">No members found</h3>
                    <p class="text-xs text-gray-500" x-show="allMembers.length === 0">Click "Sync Members" to pull data from SportsEngine</p>
                    <p class="text-xs text-gray-500" x-show="allMembers.length > 0">Try adjusting your filters</p>
                </div>
            </div>
        </div>

        <!-- Sidebar Detail (right) -->
        <div x-show="selectedMember" x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="translate-x-full opacity-0" x-transition:enter-end="translate-x-0 opacity-100"
             class="w-80 bg-white overflow-y-auto flex-shrink-0 shadow-lg">

            <template x-if="selectedMember">
                <div>
                    <!-- Sidebar Header -->
                    <div class="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between z-[5]">
                        <h2 class="text-sm font-bold text-gray-900 truncate" x-text="displayName(selectedMember)"></h2>
                        <button @click="selectedMember = null" class="p-1 rounded hover:bg-gray-100 text-gray-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- Profile Section -->
                    <div class="px-4 py-3 border-b border-gray-100">
                        <div class="flex items-center mb-3">
                            <div class="h-10 w-10 rounded-full bg-pines-100 flex items-center justify-center text-pines-700 text-sm font-bold" x-text="initials(selectedMember)"></div>
                            <div class="ml-3">
                                <div class="text-sm font-semibold text-gray-900" x-text="displayName(selectedMember)"></div>
                                <div class="text-xs text-gray-500" x-show="selectedMember.preferredName" x-text="'Goes by ' + selectedMember.preferredName"></div>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <template x-if="selectedMember.dateOfBirth">
                                <div class="flex items-center text-xs">
                                    <i class="fa-regular fa-calendar-days w-4 text-gray-400 text-center"></i>
                                    <span class="ml-2 text-gray-600" x-text="formatDob(selectedMember.dateOfBirth)"></span>
                                    <span class="ml-1 text-gray-400" x-text="'(' + age(selectedMember.dateOfBirth) + ' yrs)'"></span>
                                </div>
                            </template>
                            <template x-if="selectedMember.gender">
                                <div class="flex items-center text-xs">
                                    <i class="fa-solid fa-user w-4 text-gray-400 text-center"></i>
                                    <span class="ml-2 text-gray-600" x-text="selectedMember.gender"></span>
                                </div>
                            </template>
                            <template x-if="selectedMember.graduationYear">
                                <div class="flex items-center text-xs">
                                    <i class="fa-solid fa-graduation-cap w-4 text-gray-400 text-center"></i>
                                    <span class="ml-2 text-gray-600" x-text="'Class of ' + selectedMember.graduationYear"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Jersey & Registrations Section -->
                    <template x-if="selectedMember.player">
                        <div class="px-4 py-3 border-b border-gray-100">
                            <h3 class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Jersey & Registrations</h3>
                            <!-- Jersey number -->
                            <div class="flex items-center mb-3">
                                <template x-if="selectedMember.player.jerseyNumber">
                                    <div class="flex items-center">
                                        <div class="flex items-center justify-center w-10 h-10 rounded-full bg-pines-100 text-pines-700 text-lg font-bold" x-text="selectedMember.player.jerseyNumber"></div>
                                        <div class="ml-2.5">
                                            <div class="text-xs font-medium text-gray-900">Jersey Number</div>
                                            <div class="text-[10px] text-gray-500" x-text="selectedMember.player.locked ? 'Locked' : 'Unlocked'"
                                                 :class="selectedMember.player.locked ? 'text-pines-600' : 'text-gray-400'"></div>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="!selectedMember.player.jerseyNumber">
                                    <div class="flex items-center">
                                        <div class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 text-gray-400 text-xs">
                                            <i class="fa-solid fa-shirt"></i>
                                        </div>
                                        <div class="ml-2.5 text-xs text-gray-400">No jersey assigned</div>
                                    </div>
                                </template>
                            </div>
                            <!-- Registrations -->
                            <template x-if="selectedMember.player.registrations && selectedMember.player.registrations.length > 0">
                                <div class="space-y-1.5">
                                    <template x-for="r in selectedMember.player.registrations" :key="r.id">
                                        <div class="flex items-center bg-gray-50 rounded-lg px-2.5 py-1.5">
                                            <i class="fa-solid fa-futbol w-4 text-gray-400 text-[10px] text-center"></i>
                                            <div class="ml-2 flex-1 min-w-0">
                                                <div class="text-xs font-medium text-gray-900 truncate" x-text="r.sport"></div>
                                                <div class="text-[10px] text-gray-500 truncate" x-text="r.division + ' · ' + r.season"></div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template x-if="!selectedMember.player.registrations || selectedMember.player.registrations.length === 0">
                                <div class="text-xs text-gray-400 italic">No registrations</div>
                            </template>
                        </div>
                    </template>

                    <!-- Contact Section -->
                    <div class="px-4 py-3 border-b border-gray-100">
                        <h3 class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Contact</h3>
                        <div class="space-y-1.5">
                            <template x-if="selectedMember.email">
                                <div class="flex items-center text-xs">
                                    <i class="fa-regular fa-envelope w-4 text-gray-400 text-center"></i>
                                    <a :href="'mailto:' + selectedMember.email" class="ml-2 text-pines-600 hover:underline truncate" x-text="selectedMember.email"></a>
                                </div>
                            </template>
                            <template x-if="selectedMember.phone">
                                <div class="flex items-center text-xs">
                                    <i class="fa-solid fa-phone w-4 text-gray-400 text-center"></i>
                                    <a :href="'tel:' + selectedMember.phone" class="ml-2 text-pines-600 hover:underline" x-text="formatPhone(selectedMember.phone)"></a>
                                </div>
                            </template>
                            <div x-show="!selectedMember.email && !selectedMember.phone" class="text-xs text-gray-400 italic">No contact info</div>
                        </div>
                    </div>

                    <!-- Address Section -->
                    <template x-if="selectedMember.address">
                        <div class="px-4 py-3 border-b border-gray-100">
                            <h3 class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Address</h3>
                            <div class="text-xs text-gray-600 space-y-0.5">
                                <div x-show="selectedMember.address.address1" x-text="selectedMember.address.address1"></div>
                                <div x-show="selectedMember.address.address2" x-text="selectedMember.address.address2"></div>
                                <div>
                                    <span x-text="selectedMember.address.city"></span><span x-show="selectedMember.address.city && selectedMember.address.state">, </span>
                                    <span x-text="selectedMember.address.state"></span>
                                    <span class="ml-1" x-text="selectedMember.address.postalCode"></span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Guardians Section -->
                    <template x-if="selectedMember.guardians && selectedMember.guardians.length > 0">
                        <div class="px-4 py-3 border-b border-gray-100">
                            <h3 class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2">
                                Parents / Guardians
                                <span class="ml-1 text-gray-400" x-text="'(' + selectedMember.guardians.length + ')'"></span>
                            </h3>
                            <div class="space-y-2">
                                <template x-for="g in selectedMember.guardians" :key="g.id">
                                    <div class="bg-gray-50 rounded-lg p-2.5">
                                        <div class="flex items-center mb-1.5">
                                            <div class="h-6 w-6 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 text-[9px] font-bold" x-text="g.firstName.charAt(0) + g.lastName.charAt(0)"></div>
                                            <div class="ml-2">
                                                <div class="text-xs font-medium text-gray-900" x-text="g.firstName + ' ' + g.lastName"></div>
                                                <div class="text-[10px] text-gray-500 capitalize" x-show="g.type" x-text="g.type"></div>
                                            </div>
                                        </div>
                                        <div class="space-y-1 ml-8">
                                            <template x-if="g.email">
                                                <div class="flex items-center text-[10px]">
                                                    <i class="fa-regular fa-envelope w-3 text-gray-400 text-center"></i>
                                                    <a :href="'mailto:' + g.email" class="ml-1.5 text-pines-600 hover:underline truncate" x-text="g.email"></a>
                                                </div>
                                            </template>
                                            <template x-if="g.phone">
                                                <div class="flex items-center text-[10px]">
                                                    <i class="fa-solid fa-phone w-3 text-gray-400 text-center"></i>
                                                    <a :href="'tel:' + g.phone" class="ml-1.5 text-pines-600 hover:underline" x-text="formatPhone(g.phone)"></a>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Memberships Section -->
                    <template x-if="selectedMember.memberships">
                        <div class="px-4 py-3">
                            <h3 class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Memberships</h3>
                            <div class="flex flex-wrap gap-1">
                                <template x-for="m in selectedMember.memberships.split(', ')" :key="m">
                                    <span class="inline-flex items-center px-1.5 py-0.5 text-[10px] rounded bg-pines-50 text-pines-700" x-text="m"></span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <script>
    function membersApp() {
        return {
            loading: true,
            syncing: false,
            allMembers: [],
            filteredMembers: [],
            displayList: [],
            selectedMember: null,
            filters: { search: '', type: '', city: '' },
            availableCities: [],

            async init() {
                await this.loadMembers();
                this.loading = false;
            },

            async loadMembers() {
                try {
                    const response = await fetch('/api/members');
                    const data = await response.json();
                    this.allMembers = data.members;
                    this.buildCityOptions();
                    this.applyFilters();
                } catch (error) {
                    console.error('Failed to load members:', error);
                }
            },

            buildCityOptions() {
                const cities = new Set();
                this.allMembers.forEach(m => {
                    if (m.address && m.address.city) cities.add(m.address.city);
                });
                this.availableCities = [...cities].sort();
            },

            applyFilters() {
                this.filteredMembers = this.allMembers.filter(m => {
                    if (this.filters.search) {
                        const s = this.filters.search.toLowerCase();
                        const name = (m.firstName + ' ' + m.lastName).toLowerCase();
                        const email = (m.email || '').toLowerCase();
                        const phone = (m.phone || '');
                        const jersey = m.player && m.player.jerseyNumber ? String(m.player.jerseyNumber) : '';
                        const guardianMatch = (m.guardians || []).some(g =>
                            (g.firstName + ' ' + g.lastName).toLowerCase().includes(s) ||
                            (g.email || '').toLowerCase().includes(s) ||
                            (g.phone || '').includes(s)
                        );
                        if (!name.includes(s) && !email.includes(s) && !phone.includes(s) && !jersey.includes(s) && !guardianMatch) return false;
                    }
                    if (this.filters.type === 'child') {
                        if (!m.guardians || m.guardians.length === 0) return false;
                    }
                    if (this.filters.type === 'adult') {
                        if (m.guardians && m.guardians.length > 0) return false;
                    }
                    if (this.filters.city) {
                        if (!m.address || m.address.city !== this.filters.city) return false;
                    }
                    return true;
                });
                this.buildDisplayList();
            },

            buildDisplayList() {
                this.displayList = [];
                let lastLetter = null;
                const letterCounts = {};

                this.filteredMembers.forEach(m => {
                    const letter = (m.lastName || '?').charAt(0).toUpperCase();
                    letterCounts[letter] = (letterCounts[letter] || 0) + 1;
                });

                this.filteredMembers.forEach(m => {
                    const letter = (m.lastName || '?').charAt(0).toUpperCase();
                    if (letter !== lastLetter) {
                        this.displayList.push({
                            _isHeader: true,
                            _key: 'h-' + letter,
                            _letter: letter,
                            _count: letterCounts[letter] || 0,
                        });
                        lastLetter = letter;
                    }
                    this.displayList.push({ ...m, _isHeader: false, _key: 'm-' + m.id });
                });
            },

            selectMember(member) {
                this.selectedMember = (this.selectedMember && this.selectedMember.id === member.id) ? null : member;
            },

            clearFilters() {
                this.filters = { search: '', type: '', city: '' };
                this.applyFilters();
            },

            displayName(m) {
                let name = m.firstName;
                if (m.preferredName) name = m.preferredName;
                name += ' ' + m.lastName;
                if (m.suffix) name += ' ' + m.suffix;
                return name;
            },

            initials(m) {
                return ((m.firstName || '?').charAt(0) + (m.lastName || '?').charAt(0)).toUpperCase();
            },

            formatDob(dob) {
                if (!dob) return '';
                try {
                    const d = new Date(dob);
                    if (isNaN(d)) return dob;
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                } catch { return dob; }
            },

            age(dob) {
                if (!dob) return '';
                try {
                    const d = new Date(dob);
                    if (isNaN(d)) return '';
                    const now = new Date();
                    let a = now.getFullYear() - d.getFullYear();
                    if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) a--;
                    return a;
                } catch { return ''; }
            },

            formatPhone(phone) {
                if (!phone) return '';
                const digits = phone.replace(/\D/g, '');
                if (digits.length === 10) {
                    return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6);
                }
                if (digits.length === 11 && digits.startsWith('1')) {
                    return '(' + digits.slice(1,4) + ') ' + digits.slice(4,7) + '-' + digits.slice(7);
                }
                return phone;
            },

            async syncMembers() {
                if (!confirm('Sync members directory from SportsEngine? This may take several minutes.')) return;
                this.syncing = true;
                try {
                    const response = await fetch('/api/members/sync', { method: 'POST' });
                    const data = await response.json();
                    if (data.status === 'started' || data.status === 'already_running') {
                        this._pollSync();
                    } else {
                        alert('Sync failed: ' + (data.detail || 'Unknown error'));
                        this.syncing = false;
                    }
                } catch (error) {
                    console.error('Sync failed:', error);
                    alert('Sync failed: ' + error.message);
                    this.syncing = false;
                }
            },

            async _pollSync() {
                try {
                    const response = await fetch('/api/members/sync-status');
                    const data = await response.json();
                    if (data.status === 'running') {
                        setTimeout(() => this._pollSync(), 3000);
                    } else if (data.status === 'success') {
                        this.syncing = false;
                        alert(`Sync complete!\n\nNew: ${data.new_members}\nUpdated: ${data.updated_members}\nGuardians: ${data.guardians_added}\nSkipped (existing): ${data.skipped_existing || 0}`);
                        await this.loadMembers();
                    } else if (data.status === 'error') {
                        this.syncing = false;
                        alert('Sync failed: ' + (data.detail || 'Unknown error'));
                    } else {
                        this.syncing = false;
                    }
                } catch (error) {
                    console.error('Poll failed:', error);
                    setTimeout(() => this._pollSync(), 5000);
                }
            },
        }
    }
    </script>
    <script src="/static/sidebar.js"></script>
</body>
</html>
