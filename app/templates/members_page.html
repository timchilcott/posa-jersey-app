<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Members</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50" x-data="membersApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-full mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img src="https://cdn.prod.website-files.com/681d81085457ff1ea60182c2/684103edf65163765f534531_PINES_LOGO_DARK.svg" alt="Pines" class="h-8">
                    <h1 class="text-xl font-bold text-gray-900">Members</h1>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="/admin" class="text-pines-500 hover:text-pines-700 px-3 py-2 text-sm font-medium">Players</a>
                    <a href="/inventory" class="text-pines-500 hover:text-pines-700 px-3 py-2 text-sm font-medium">Inventory</a>
                    <button @click="syncMembers()" :disabled="syncing" class="bg-pines-500 hover:bg-pines-600 disabled:opacity-50 text-white px-4 py-2 rounded-lg text-sm font-medium">
                        <span x-show="!syncing">Sync Members</span>
                        <span x-show="syncing" class="flex items-center">
                            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                            Syncing...
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="bg-white border-b border-gray-200">
        <div class="max-w-full mx-auto px-4 py-4">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="flex-1 min-w-64">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Search</label>
                    <input type="search" x-model="filters.search" @input.debounce.300ms="applyFilters()" placeholder="Name, email, or phone..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500 focus:border-transparent">
                </div>
                <div class="w-36">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Type</label>
                    <select x-model="filters.type" @change="applyFilters()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500">
                        <option value="">All</option>
                        <option value="child">Children</option>
                        <option value="adult">Adults</option>
                        <option value="hasGuardian">Has Guardian</option>
                    </select>
                </div>
                <div class="w-36">
                    <label class="block text-xs font-medium text-gray-700 mb-1">City</label>
                    <select x-model="filters.city" @change="applyFilters()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pines-500">
                        <option value="">All</option>
                        <template x-for="c in availableCities" :key="c">
                            <option :value="c" x-text="c"></option>
                        </template>
                    </select>
                </div>
                <button @click="clearFilters()" class="px-4 py-2 text-gray-600 hover:text-gray-900 text-sm font-medium">Clear</button>
            </div>
            <div class="mt-3 text-sm text-gray-600">
                Showing <span class="font-medium" x-text="filteredMembers.length"></span> of <span x-text="allMembers.length"></span> members
            </div>
        </div>
    </div>

    <!-- Main Content: Table + Sidebar -->
    <div class="flex" style="height: calc(100vh - 145px);">

        <!-- Member List (left) -->
        <div class="flex-1 overflow-y-auto" :class="selectedMember ? 'border-r border-gray-200' : ''">
            <div x-show="loading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
                <p class="mt-2 text-gray-600">Loading members...</p>
            </div>

            <div x-show="!loading">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0 z-[5]">
                        <tr>
                            <th class="w-64 px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">City</th>
                            <th class="w-32 px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Guardians</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="item in displayList" :key="item._key">
                            <tr :class="item._isHeader
                                ? 'bg-pines-50 border-t-2 border-pines-200'
                                : (selectedMember && selectedMember.id === item.id ? 'bg-pines-50 cursor-pointer' : 'hover:bg-gray-50 cursor-pointer')"
                                @click="!item._isHeader && selectMember(item)">

                                <!-- Letter header row -->
                                <template x-if="item._isHeader">
                                    <td colspan="5" class="px-4 py-2">
                                        <span class="text-sm font-bold text-pines-700" x-text="item._letter"></span>
                                        <span class="ml-2 text-xs text-pines-500" x-text="item._count + ' members'"></span>
                                    </td>
                                </template>

                                <!-- Data rows -->
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-3">
                                        <div class="flex items-center">
                                            <div class="flex-shrink-0 h-8 w-8 rounded-full bg-pines-100 flex items-center justify-center text-pines-700 text-xs font-bold" x-text="initials(item)"></div>
                                            <div class="ml-3">
                                                <div class="text-sm font-medium text-gray-900" x-text="displayName(item)"></div>
                                                <div class="text-xs text-gray-500" x-show="item.dateOfBirth" x-text="formatDob(item.dateOfBirth)"></div>
                                            </div>
                                        </div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-3">
                                        <div class="text-sm text-gray-600 truncate max-w-48" x-text="item.email || '-'"></div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-3">
                                        <div class="text-sm text-gray-600" x-text="item.phone || '-'"></div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-3">
                                        <div class="text-sm text-gray-600" x-text="item.address ? item.address.city || '-' : '-'"></div>
                                    </td>
                                </template>
                                <template x-if="!item._isHeader">
                                    <td class="px-4 py-3">
                                        <template x-if="item.guardians && item.guardians.length > 0">
                                            <div class="flex flex-wrap gap-1">
                                                <template x-for="g in item.guardians" :key="g.id">
                                                    <span class="inline-flex items-center px-1.5 py-0.5 text-xs rounded bg-blue-50 text-blue-700" x-text="g.firstName + ' ' + g.lastName.charAt(0) + '.'"></span>
                                                </template>
                                            </div>
                                        </template>
                                        <template x-if="!item.guardians || item.guardians.length === 0">
                                            <span class="text-xs text-gray-400">-</span>
                                        </template>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div x-show="filteredMembers.length === 0 && !loading" class="text-center py-12">
                    <div class="text-gray-400 text-5xl mb-3">👥</div>
                    <h3 class="text-lg font-medium text-gray-900 mb-1">No members found</h3>
                    <p class="text-gray-500" x-show="allMembers.length === 0">Click "Sync Members" to pull data from SportsEngine</p>
                    <p class="text-gray-500" x-show="allMembers.length > 0">Try adjusting your filters</p>
                </div>
            </div>
        </div>

        <!-- Sidebar Detail (right) -->
        <div x-show="selectedMember" x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="translate-x-full opacity-0" x-transition:enter-end="translate-x-0 opacity-100"
             class="w-96 bg-white overflow-y-auto flex-shrink-0 shadow-lg">

            <template x-if="selectedMember">
                <div>
                    <!-- Sidebar Header -->
                    <div class="sticky top-0 bg-white border-b border-gray-200 px-5 py-4 flex items-center justify-between z-[5]">
                        <h2 class="text-lg font-bold text-gray-900 truncate" x-text="displayName(selectedMember)"></h2>
                        <button @click="selectedMember = null" class="p-1 rounded hover:bg-gray-100 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- Profile Section -->
                    <div class="px-5 py-4 border-b border-gray-100">
                        <div class="flex items-center mb-4">
                            <div class="h-14 w-14 rounded-full bg-pines-100 flex items-center justify-center text-pines-700 text-lg font-bold" x-text="initials(selectedMember)"></div>
                            <div class="ml-4">
                                <div class="text-base font-semibold text-gray-900" x-text="displayName(selectedMember)"></div>
                                <div class="text-sm text-gray-500" x-show="selectedMember.preferredName" x-text="'Goes by ' + selectedMember.preferredName"></div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <template x-if="selectedMember.dateOfBirth">
                                <div class="flex items-center text-sm">
                                    <svg class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    <span class="text-gray-600" x-text="formatDob(selectedMember.dateOfBirth)"></span>
                                    <span class="ml-1 text-gray-400" x-text="'(' + age(selectedMember.dateOfBirth) + ' yrs)'"></span>
                                </div>
                            </template>
                            <template x-if="selectedMember.gender">
                                <div class="flex items-center text-sm">
                                    <svg class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    <span class="text-gray-600" x-text="selectedMember.gender"></span>
                                </div>
                            </template>
                            <template x-if="selectedMember.graduationYear">
                                <div class="flex items-center text-sm">
                                    <svg class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m-3-3l3 3 3-3"></path></svg>
                                    <span class="text-gray-600" x-text="'Class of ' + selectedMember.graduationYear"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Contact Section -->
                    <div class="px-5 py-4 border-b border-gray-100">
                        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Contact</h3>
                        <div class="space-y-2">
                            <template x-if="selectedMember.email">
                                <div class="flex items-center text-sm">
                                    <svg class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    <a :href="'mailto:' + selectedMember.email" class="text-pines-600 hover:underline truncate" x-text="selectedMember.email"></a>
                                </div>
                            </template>
                            <template x-if="selectedMember.phone">
                                <div class="flex items-center text-sm">
                                    <svg class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    <a :href="'tel:' + selectedMember.phone" class="text-pines-600 hover:underline" x-text="formatPhone(selectedMember.phone)"></a>
                                </div>
                            </template>
                            <div x-show="!selectedMember.email && !selectedMember.phone" class="text-sm text-gray-400 italic">No contact info</div>
                        </div>
                    </div>

                    <!-- Address Section -->
                    <template x-if="selectedMember.address">
                        <div class="px-5 py-4 border-b border-gray-100">
                            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Address</h3>
                            <div class="text-sm text-gray-600 space-y-0.5">
                                <div x-show="selectedMember.address.address1" x-text="selectedMember.address.address1"></div>
                                <div x-show="selectedMember.address.address2" x-text="selectedMember.address.address2"></div>
                                <div>
                                    <span x-text="selectedMember.address.city"></span><span x-show="selectedMember.address.city && selectedMember.address.state">, </span>
                                    <span x-text="selectedMember.address.state"></span>
                                    <span class="ml-1" x-text="selectedMember.address.postalCode"></span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Guardians Section -->
                    <template x-if="selectedMember.guardians && selectedMember.guardians.length > 0">
                        <div class="px-5 py-4 border-b border-gray-100">
                            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">
                                Parents / Guardians
                                <span class="ml-1 text-gray-400" x-text="'(' + selectedMember.guardians.length + ')'"></span>
                            </h3>
                            <div class="space-y-3">
                                <template x-for="g in selectedMember.guardians" :key="g.id">
                                    <div class="bg-gray-50 rounded-lg p-3">
                                        <div class="flex items-center mb-2">
                                            <div class="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 text-xs font-bold" x-text="g.firstName.charAt(0) + g.lastName.charAt(0)"></div>
                                            <div class="ml-2">
                                                <div class="text-sm font-medium text-gray-900" x-text="g.firstName + ' ' + g.lastName"></div>
                                                <div class="text-xs text-gray-500 capitalize" x-show="g.type" x-text="g.type"></div>
                                            </div>
                                        </div>
                                        <div class="space-y-1 ml-10">
                                            <template x-if="g.email">
                                                <div class="flex items-center text-xs">
                                                    <svg class="w-3 h-3 text-gray-400 mr-1.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                                    <a :href="'mailto:' + g.email" class="text-pines-600 hover:underline truncate" x-text="g.email"></a>
                                                </div>
                                            </template>
                                            <template x-if="g.phone">
                                                <div class="flex items-center text-xs">
                                                    <svg class="w-3 h-3 text-gray-400 mr-1.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                                    <a :href="'tel:' + g.phone" class="text-pines-600 hover:underline" x-text="formatPhone(g.phone)"></a>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Memberships Section -->
                    <template x-if="selectedMember.memberships">
                        <div class="px-5 py-4">
                            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Memberships</h3>
                            <div class="flex flex-wrap gap-1">
                                <template x-for="m in selectedMember.memberships.split(', ')" :key="m">
                                    <span class="inline-flex items-center px-2 py-0.5 text-xs rounded bg-pines-50 text-pines-700" x-text="m"></span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <script>
    function membersApp() {
        return {
            loading: true,
            syncing: false,
            allMembers: [],
            filteredMembers: [],
            displayList: [],
            selectedMember: null,
            filters: { search: '', type: '', city: '' },
            availableCities: [],

            async init() {
                await this.loadMembers();
                this.loading = false;
            },

            async loadMembers() {
                try {
                    const response = await fetch('/api/members');
                    const data = await response.json();
                    this.allMembers = data.members;
                    this.buildCityOptions();
                    this.applyFilters();
                } catch (error) {
                    console.error('Failed to load members:', error);
                }
            },

            buildCityOptions() {
                const cities = new Set();
                this.allMembers.forEach(m => {
                    if (m.address && m.address.city) cities.add(m.address.city);
                });
                this.availableCities = [...cities].sort();
            },

            applyFilters() {
                this.filteredMembers = this.allMembers.filter(m => {
                    if (this.filters.search) {
                        const s = this.filters.search.toLowerCase();
                        const name = (m.firstName + ' ' + m.lastName).toLowerCase();
                        const email = (m.email || '').toLowerCase();
                        const phone = (m.phone || '');
                        const guardianMatch = (m.guardians || []).some(g =>
                            (g.firstName + ' ' + g.lastName).toLowerCase().includes(s) ||
                            (g.email || '').toLowerCase().includes(s) ||
                            (g.phone || '').includes(s)
                        );
                        if (!name.includes(s) && !email.includes(s) && !phone.includes(s) && !guardianMatch) return false;
                    }
                    if (this.filters.type === 'child') {
                        if (!m.guardians || m.guardians.length === 0) return false;
                    }
                    if (this.filters.type === 'adult') {
                        if (m.guardians && m.guardians.length > 0) return false;
                    }
                    if (this.filters.type === 'hasGuardian') {
                        if (!m.guardians || m.guardians.length === 0) return false;
                    }
                    if (this.filters.city) {
                        if (!m.address || m.address.city !== this.filters.city) return false;
                    }
                    return true;
                });
                this.buildDisplayList();
            },

            buildDisplayList() {
                this.displayList = [];
                let lastLetter = null;
                const letterCounts = {};

                // Count members per letter
                this.filteredMembers.forEach(m => {
                    const letter = (m.lastName || '?').charAt(0).toUpperCase();
                    letterCounts[letter] = (letterCounts[letter] || 0) + 1;
                });

                this.filteredMembers.forEach(m => {
                    const letter = (m.lastName || '?').charAt(0).toUpperCase();
                    if (letter !== lastLetter) {
                        this.displayList.push({
                            _isHeader: true,
                            _key: 'h-' + letter,
                            _letter: letter,
                            _count: letterCounts[letter] || 0,
                        });
                        lastLetter = letter;
                    }
                    this.displayList.push({ ...m, _isHeader: false, _key: 'm-' + m.id });
                });
            },

            selectMember(member) {
                this.selectedMember = (this.selectedMember && this.selectedMember.id === member.id) ? null : member;
            },

            clearFilters() {
                this.filters = { search: '', type: '', city: '' };
                this.applyFilters();
            },

            displayName(m) {
                let name = m.firstName;
                if (m.preferredName) name = m.preferredName;
                name += ' ' + m.lastName;
                if (m.suffix) name += ' ' + m.suffix;
                return name;
            },

            initials(m) {
                return ((m.firstName || '?').charAt(0) + (m.lastName || '?').charAt(0)).toUpperCase();
            },

            formatDob(dob) {
                if (!dob) return '';
                try {
                    const d = new Date(dob);
                    if (isNaN(d)) return dob;
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                } catch { return dob; }
            },

            age(dob) {
                if (!dob) return '';
                try {
                    const d = new Date(dob);
                    if (isNaN(d)) return '';
                    const now = new Date();
                    let a = now.getFullYear() - d.getFullYear();
                    if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) a--;
                    return a;
                } catch { return ''; }
            },

            formatPhone(phone) {
                if (!phone) return '';
                const digits = phone.replace(/\D/g, '');
                if (digits.length === 10) {
                    return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6);
                }
                if (digits.length === 11 && digits.startsWith('1')) {
                    return '(' + digits.slice(1,4) + ') ' + digits.slice(4,7) + '-' + digits.slice(7);
                }
                return phone;
            },

            async syncMembers() {
                if (!confirm('Sync members directory from SportsEngine? This may take a minute.')) return;
                this.syncing = true;
                try {
                    const response = await fetch('/api/members/sync', { method: 'POST' });
                    const data = await response.json();
                    if (data.status === 'success') {
                        alert(`Sync complete!\n\nNew: ${data.new_members}\nUpdated: ${data.updated_members}\nGuardians: ${data.guardians_added}`);
                        await this.loadMembers();
                    } else {
                        alert('Sync failed: ' + (data.detail || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Sync failed:', error);
                    alert('Sync failed: ' + error.message);
                }
                this.syncing = false;
            },
        }
    }
    </script>
</body>
</html>
