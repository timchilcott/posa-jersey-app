<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
    <script src="https://kit.fontawesome.com/423D987F-13A9-43DE-B9E1-9CFB99173AF3.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50" x-data="settingsApp()" x-init="init()" x-cloak>

    <div class="px-6 py-6 max-w-2xl">
        <template x-for="group in columnGroups" :key="group.key">
            <div class="mb-8">
                <h2 x-show="columnGroups.length > 1"
                    class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
                    x-text="group.title + ' Columns'"></h2>
                <p class="text-xs text-gray-500 mb-4">Toggle columns on or off for the table view.</p>
                <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-100">
                    <template x-for="col in group.columns" :key="col.id">
                        <div class="flex items-center justify-between px-4 py-3">
                            <span class="text-sm text-gray-900" x-text="col.label"></span>
                            <button type="button" @click="toggle(group.key, col.id)"
                                    class="relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-pines-500 focus:ring-offset-2"
                                    :class="visibility[group.key][col.id] ? 'bg-pines-500' : 'bg-gray-200'"
                                    role="switch" :aria-checked="visibility[group.key][col.id]">
                                <span class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
                                      :class="visibility[group.key][col.id] ? 'translate-x-4' : 'translate-x-0'"></span>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <button @click="resetDefaults()" class="text-xs text-gray-400 hover:text-gray-600 transition-colors">
            <i class="fa-solid fa-arrow-rotate-left mr-1"></i> Reset to defaults
        </button>
    </div>

<script src="/static/column-config.js"></script>
<script>
function settingsApp() {
    return {
        columnGroups: [],
        visibility: {},

        init() {
            var path = window.location.pathname;
            var COLS = window.POSA_COLUMNS;

            // Deep-clone columns so Alpine proxies don't conflict with shared POSA_COLUMNS
            function cloneCols(arr) {
                return arr.map(function(c) { return { id: c.id, label: c.label, defaultOn: c.defaultOn }; });
            }

            // Inventory settings manages both Equipment and Checked Out tables
            if (path === '/inventory/settings') {
                this.columnGroups = [
                    { key: 'inventory', title: 'Equipment', columns: cloneCols(COLS.inventory.columns) },
                    { key: 'checked_out', title: 'Checked Out', columns: cloneCols(COLS.checked_out.columns) },
                ];
            } else {
                var section = COLS.getSection(path);
                if (section && COLS[section]) {
                    this.columnGroups = [{ key: section, title: '', columns: cloneCols(COLS[section].columns) }];
                }
            }

            // Load current visibility for each group
            var vis = {};
            this.columnGroups.forEach(function(g) {
                vis[g.key] = COLS.load(g.key);
            });
            this.visibility = vis;
        },

        toggle(groupKey, colId) {
            this.visibility[groupKey][colId] = !this.visibility[groupKey][colId];
            window.POSA_COLUMNS.save(groupKey, this.visibility[groupKey]);
        },

        resetDefaults() {
            var COLS = window.POSA_COLUMNS;
            var vis = {};
            this.columnGroups.forEach(function(g) {
                vis[g.key] = COLS.getDefaults(g.key);
                COLS.save(g.key, vis[g.key]);
            });
            this.visibility = vis;
        }
    };
}
</script>
<script src="/static/sidebar.js"></script>
</body>
</html>
