<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Seasons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-50" x-data="seasonsApp()" x-init="init()" x-cloak>

    <!-- Filter bar -->
    <div class="bg-white border-b border-gray-200" x-data="{ showMore: false }">
        <div class="px-6 py-2.5 flex items-center gap-2 flex-wrap">
            <span class="text-xs text-gray-600 mr-1" x-text="filteredTeams.length + ' teams'"></span>
            <!-- Search -->
            <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="search" x-model="filters.search" @input.debounce.300ms="applyFilters()" placeholder="Search..."
                       class="pl-8 pr-3 py-1.5 border border-gray-200 rounded-md text-xs w-44 focus:ring-1 focus:ring-pines-500 focus:border-pines-500 placeholder-gray-400">
            </div>
            <!-- All filter pills (behind + Filter) -->
            <template x-if="showMore || hasAnyFilter()">
                <div class="contents">
                    <!-- Sport pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.sport.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.sport, 'sport', 'sports')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="sp in availableSports" :key="sp">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.sport.includes(sp)"
                                           @change="toggleFilter('sport', sp)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="sp"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Season pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.season.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.season, 'season', 'seasons')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="s in availableSeasons" :key="s">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.season.includes(s)"
                                           @change="toggleFilter('season', s)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="s"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Division pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.division.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.division, 'division', 'divisions')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-48 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="d in availableDivisions" :key="d">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.division.includes(d)"
                                           @change="toggleFilter('division', d)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="d"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Status pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="filters.status.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(filters.status, 'status', 'statuses')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="st in availableStatuses" :key="st">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="filters.status.includes(st)"
                                           @change="toggleFilter('status', st)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="st"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Collapse filters -->
                    <button x-show="showMore && !hasAnyFilter()"
                            @click="showMore = false"
                            class="text-xs text-gray-400 hover:text-gray-600 px-1 py-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </template>
            <!-- + Filter toggle -->
            <button x-show="!showMore && !hasAnyFilter()"
                    @click="showMore = true"
                    class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border border-dashed border-gray-300 text-gray-400 hover:text-gray-600 hover:border-gray-400 transition-colors">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Filter
            </button>
            <!-- Clear -->
            <button x-show="filters.search || hasAnyFilter()"
                    @click="clearFilters(); showMore = false" class="text-xs text-gray-400 hover:text-gray-600 px-1.5 py-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <!-- Spacer + actions -->
            <div class="ml-auto flex items-center gap-2">
                <button @click="syncTeams()" :disabled="syncing"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium border transition-colors"
                        :class="syncing ? 'border-gray-200 text-gray-400 cursor-wait' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                    <i class="fa-solid fa-arrows-rotate text-xs" :class="syncing && 'animate-spin'"></i>
                    <span x-text="syncing ? 'Syncing...' : 'Sync'"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Teams table -->
    <main class="bg-white px-6 pt-4">
        <div x-show="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
            <p class="mt-2 text-gray-600">Loading teams...</p>
        </div>

        <div x-show="!loading">
            <div class="overflow-x-auto">
                <table x-show="filteredTeams.length > 0" class="min-w-full">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th x-show="ecv('team')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap" style="width:30%">Team</th>
                            <th x-show="ecv('sport')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap" style="width:12%">Sport</th>
                            <th x-show="ecv('season')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap" style="width:18%">Season</th>
                            <th x-show="ecv('division')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap" style="width:18%">Division</th>
                            <th x-show="ecv('players')" class="px-4 py-2.5 text-center text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap" style="width:8%">Players</th>
                            <th x-show="ecv('staff')" class="px-4 py-2.5 text-center text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap" style="width:8%">Staff</th>
                            <th x-show="ecv('status')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap" style="width:8%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="team in filteredTeams" :key="team.id">
                            <tr class="hover:bg-gray-50 cursor-pointer transition-colors border-b border-gray-100"
                                :class="selectedTeam && selectedTeam.id === team.id ? 'bg-pines-50/50' : ''"
                                @click="openPanel(team)">
                                <!-- Team name with logo -->
                                <td x-show="ecv('team')" class="px-4 py-3 whitespace-nowrap">
                                    <div class="flex items-center gap-2">
                                        <img x-show="team.logoUrl" :src="team.logoUrl" class="w-6 h-6 object-contain rounded" @error="$el.style.display='none'">
                                        <div class="text-sm font-medium text-gray-900" x-text="team.name"></div>
                                    </div>
                                </td>
                                <!-- Sport -->
                                <td x-show="ecv('sport')" class="px-4 py-3 whitespace-nowrap">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                                          :class="sportColor(team.sport)"
                                          x-text="team.sport || '-'"></span>
                                </td>
                                <!-- Season -->
                                <td x-show="ecv('season')" class="px-4 py-3 whitespace-nowrap">
                                    <span class="text-sm text-gray-900" x-text="team.seasonName || '-'"></span>
                                </td>
                                <!-- Division -->
                                <td x-show="ecv('division')" class="px-4 py-3 whitespace-nowrap">
                                    <span class="text-sm text-gray-900" x-text="team.divisionName || '-'"></span>
                                </td>
                                <!-- Players count -->
                                <td x-show="ecv('players')" class="px-4 py-3 text-center whitespace-nowrap">
                                    <span class="text-sm text-gray-900" x-text="team.playerCount"></span>
                                </td>
                                <!-- Staff count -->
                                <td x-show="ecv('staff')" class="px-4 py-3 text-center whitespace-nowrap">
                                    <span class="text-sm text-gray-900" x-text="team.staffCount"></span>
                                </td>
                                <!-- Status -->
                                <td x-show="ecv('status')" class="px-4 py-3 whitespace-nowrap">
                                    <span class="text-xs" :class="statusColor(team.status)" x-text="team.status || '-'"></span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div x-show="filteredTeams.length === 0 && !loading" class="text-center py-12">
                <div class="text-gray-400 text-5xl mb-3"><i class="fa-solid fa-trophy"></i></div>
                <h3 class="text-lg font-medium text-gray-900 mb-1">No teams found</h3>
                <p class="text-gray-500" x-show="allTeams.length === 0">Click "Sync" to pull team data from SportsEngine</p>
                <p class="text-gray-500" x-show="allTeams.length > 0">Try adjusting your filters</p>
            </div>
        </div>
    </main>

    <!-- Detail Side Panel -->
    <div x-show="panelOpen" x-cloak class="fixed inset-0 z-30" @click.self="closePanel()">
        <div x-show="panelOpen"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
             class="absolute top-0 right-0 h-full w-full sm:w-[28rem] bg-white border-l border-gray-200 shadow-lg flex flex-col">
            <!-- Panel header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 flex-shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                    <img x-show="selectedTeam && selectedTeam.logoUrl" :src="selectedTeam?.logoUrl" class="w-7 h-7 object-contain rounded flex-shrink-0" @error="$el.style.display='none'">
                    <h2 class="text-lg font-semibold text-gray-900 truncate" x-text="selectedTeam?.name || 'Team Details'"></h2>
                </div>
                <button @click="closePanel()" class="p-1 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <!-- Panel body -->
            <template x-if="selectedTeam">
            <div class="flex-1 overflow-y-auto px-6 py-5 space-y-5">
                <!-- Loading state -->
                <div x-show="panelLoading" class="text-center py-8">
                    <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-pines-500"></div>
                    <p class="mt-2 text-sm text-gray-500">Loading roster...</p>
                </div>

                <template x-if="!panelLoading">
                    <div class="space-y-5">
                        <!-- Team info -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Sport</label>
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" :class="sportColor(selectedTeam.sport)" x-text="selectedTeam.sport"></span>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Status</label>
                                <span class="text-sm" :class="statusColor(selectedTeam.status)" x-text="selectedTeam.status || '-'"></span>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Season</label>
                                <span class="text-sm text-gray-900" x-text="selectedTeam.seasonName || '-'"></span>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Division</label>
                                <span class="text-sm text-gray-900" x-text="selectedTeam.divisionName || '-'"></span>
                            </div>
                        </div>

                        <!-- Staff -->
                        <div x-show="teamDetail && teamDetail.staff && teamDetail.staff.length > 0">
                            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">
                                Staff
                                <span class="text-gray-400 font-normal" x-text="'(' + (teamDetail?.staff?.length || 0) + ')'"></span>
                            </label>
                            <div class="space-y-1.5">
                                <template x-for="s in teamDetail?.staff || []" :key="s.id">
                                    <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg">
                                        <div>
                                            <div class="text-sm font-medium text-gray-900" x-text="s.firstName + ' ' + s.lastName"></div>
                                            <div class="text-xs text-gray-500" x-text="s.title || 'Staff'"></div>
                                        </div>
                                        <div class="text-right">
                                            <div x-show="s.member && s.member.email" class="text-xs text-gray-500" x-text="s.member?.email"></div>
                                            <div x-show="s.member && s.member.phone" class="text-xs text-gray-500" x-text="formatPhone(s.member?.phone)"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Roster -->
                        <div x-show="teamDetail && teamDetail.players && teamDetail.players.length > 0">
                            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">
                                Roster
                                <span class="text-gray-400 font-normal" x-text="'(' + (teamDetail?.players?.length || 0) + ')'"></span>
                            </label>
                            <div class="overflow-x-auto">
                                <table class="min-w-full text-sm">
                                    <thead>
                                        <tr class="border-b border-gray-200">
                                            <th class="py-1.5 pr-3 text-left text-xs font-medium text-gray-500 uppercase">#</th>
                                            <th class="py-1.5 px-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                            <th class="py-1.5 px-3 text-left text-xs font-medium text-gray-500 uppercase">POSA #</th>
                                            <th class="py-1.5 pl-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="p in teamDetail?.players || []" :key="p.id">
                                            <tr class="border-b border-gray-50">
                                                <td class="py-2 pr-3 text-gray-900 font-medium" x-text="p.jerseyNumber || '-'"></td>
                                                <td class="py-2 px-3">
                                                    <div class="text-gray-900" x-text="p.firstName + ' ' + p.lastName"></div>
                                                    <div x-show="p.member && p.member.email" class="text-xs text-gray-400" x-text="p.member?.email"></div>
                                                </td>
                                                <td class="py-2 px-3">
                                                    <span x-show="p.posaJersey" class="inline-flex items-center px-1.5 py-0.5 rounded text-xs bg-pines-50 text-pines-700 font-medium" x-text="p.posaJersey"></span>
                                                    <span x-show="!p.posaJersey" class="text-gray-300">-</span>
                                                </td>
                                                <td class="py-2 pl-3">
                                                    <span class="text-xs" :class="rosterStatusColor(p.rosterStatus)" x-text="p.rosterStatus || '-'"></span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Empty roster -->
                        <div x-show="teamDetail && (!teamDetail.players || teamDetail.players.length === 0) && (!teamDetail.staff || teamDetail.staff.length === 0)"
                             class="text-center py-6">
                            <p class="text-sm text-gray-400 italic">No roster or staff data available</p>
                        </div>
                    </div>
                </template>
            </div>
            </template>
        </div>
    </div>

    <!-- Sync notification -->
    <div x-show="syncMessage" x-transition
         class="fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg text-sm font-medium"
         :class="syncSuccess ? 'bg-pines-500 text-white' : 'bg-red-500 text-white'"
         x-text="syncMessage"
         @click="syncMessage = ''">
    </div>

<script src="/static/column-config.js"></script>
<script>
function seasonsApp() {
    return {
        loading: true,
        syncing: false,
        syncMessage: '',
        syncSuccess: false,
        panelOpen: false,
        panelLoading: false,
        selectedTeam: null,
        teamDetail: null,
        allTeams: [],
        filteredTeams: [],
        availableSports: [],
        availableSeasons: [],
        availableDivisions: [],
        availableStatuses: [],
        filters: { search: '', sport: [], season: [], division: [], status: [] },
        colVis: {},

        ecv(colId) {
            if (this.colVis[colId]) return true;
            return this.colVis[colId] !== undefined ? this.colVis[colId] : true;
        },

        async init() {
            this.colVis = window.POSA_COLUMNS.load('seasons');
            await this.loadTeams();
            this.loading = false;
        },

        async loadTeams() {
            try {
                const res = await fetch('/api/seasons/teams');
                const data = await res.json();
                this.allTeams = data.teams;
                this.availableSports = data.availableSports || [];
                this.availableSeasons = data.availableSeasons || [];
                this.availableDivisions = data.availableDivisions || [];
                this.availableStatuses = data.availableStatuses || [];
                this.applyFilters();
            } catch (e) {
                console.error('Failed to load teams:', e);
            }
        },

        hasAnyFilter() {
            return this.filters.sport.length || this.filters.season.length || this.filters.division.length || this.filters.status.length;
        },

        toggleFilter(filterKey, value) {
            const arr = this.filters[filterKey];
            const idx = arr.indexOf(value);
            if (idx >= 0) arr.splice(idx, 1);
            else arr.push(value);
            this.applyFilters();
        },

        filterLabel(arr, singular, plural) {
            if (arr.length === 0) return 'All ' + plural;
            if (arr.length === 1) return arr[0];
            return arr.length + ' ' + plural;
        },

        applyFilters() {
            this.filteredTeams = this.allTeams.filter(t => {
                if (this.filters.search) {
                    const s = this.filters.search.toLowerCase();
                    const name = (t.name || '').toLowerCase();
                    const season = (t.seasonName || '').toLowerCase();
                    const division = (t.divisionName || '').toLowerCase();
                    if (!name.includes(s) && !season.includes(s) && !division.includes(s)) return false;
                }
                if (this.filters.sport.length && !this.filters.sport.includes(t.sport)) return false;
                if (this.filters.season.length && !this.filters.season.includes(t.seasonName)) return false;
                if (this.filters.division.length && !this.filters.division.includes(t.divisionName)) return false;
                if (this.filters.status.length && !this.filters.status.some(st => st.toLowerCase() === (t.status || '').toLowerCase())) return false;
                return true;
            });
        },

        clearFilters() {
            this.filters = { search: '', sport: [], season: [], division: [], status: [] };
            this.applyFilters();
        },

        async openPanel(team) {
            this.selectedTeam = { ...team };
            this.panelOpen = true;
            this.panelLoading = true;
            this.teamDetail = null;
            try {
                const res = await fetch('/api/seasons/teams/' + team.id);
                const data = await res.json();
                this.teamDetail = data;
                // Update selected team with full data
                if (data.team) {
                    this.selectedTeam = { ...this.selectedTeam, ...data.team };
                }
            } catch (e) {
                console.error('Failed to load team detail:', e);
            }
            this.panelLoading = false;
        },

        closePanel() {
            this.panelOpen = false;
            this.selectedTeam = null;
            this.teamDetail = null;
        },

        sportColor(sport) {
            if (!sport) return 'bg-gray-100 text-gray-600';
            const s = sport.toLowerCase();
            if (s === 'soccer') return 'bg-green-50 text-green-700';
            if (s === 'basketball') return 'bg-orange-50 text-orange-700';
            if (s.includes('football')) return 'bg-yellow-50 text-yellow-700';
            if (s === 'volleyball') return 'bg-purple-50 text-purple-700';
            if (s === 'baseball' || s === 'softball') return 'bg-red-50 text-red-700';
            return 'bg-blue-50 text-blue-700';
        },

        statusColor(status) {
            if (!status) return 'text-gray-400';
            const s = status.toLowerCase();
            if (s === 'active') return 'text-green-600';
            if (s === 'inactive' || s === 'archived') return 'text-gray-400';
            if (s === 'pending') return 'text-amber-600';
            return 'text-gray-600';
        },

        rosterStatusColor(status) {
            if (!status) return 'text-gray-400';
            const s = status.toLowerCase();
            if (s === 'approved' || s === 'active') return 'text-green-600';
            if (s === 'pending') return 'text-amber-600';
            if (s === 'denied' || s === 'removed') return 'text-red-500';
            return 'text-gray-500';
        },

        formatPhone(phone) {
            if (!phone) return '';
            const digits = phone.replace(/\D/g, '');
            if (digits.length === 10) return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6);
            if (digits.length === 11 && digits.startsWith('1')) return '(' + digits.slice(1,4) + ') ' + digits.slice(4,7) + '-' + digits.slice(7);
            return phone;
        },

        async syncTeams() {
            this.syncing = true;
            this.syncMessage = '';
            try {
                const res = await fetch('/api/seasons/sync', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'started' || data.status === 'already_running') {
                    this._pollSync();
                } else {
                    this.syncSuccess = false;
                    this.syncMessage = 'Sync failed: ' + (data.detail || 'Unknown error');
                    this.syncing = false;
                    setTimeout(() => { this.syncMessage = ''; }, 5000);
                }
            } catch (e) {
                this.syncSuccess = false;
                this.syncMessage = 'Sync failed: ' + e.message;
                this.syncing = false;
                setTimeout(() => { this.syncMessage = ''; }, 5000);
            }
        },

        async _pollSync() {
            try {
                const res = await fetch('/api/seasons/sync-status');
                const data = await res.json();
                if (data.status === 'running') {
                    setTimeout(() => this._pollSync(), 3000);
                } else if (data.status === 'success') {
                    this.syncing = false;
                    this.syncSuccess = true;
                    this.syncMessage = `Sync complete! ${data.new_teams || 0} new, ${data.updated_teams || 0} updated, ${data.roster_entries || 0} roster entries.`;
                    await this.loadTeams();
                    setTimeout(() => { this.syncMessage = ''; }, 5000);
                } else if (data.status === 'error') {
                    this.syncing = false;
                    this.syncSuccess = false;
                    this.syncMessage = 'Sync failed: ' + (data.detail || 'Unknown error');
                    setTimeout(() => { this.syncMessage = ''; }, 5000);
                } else {
                    this.syncing = false;
                }
            } catch (e) {
                console.error('Poll failed:', e);
                setTimeout(() => this._pollSync(), 5000);
            }
        },
    }
}
</script>
<script src="/static/sidebar.js"></script>
