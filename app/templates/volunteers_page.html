<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSA Volunteers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pines: { 50: '#f0f7f0', 100: '#d9edd9', 200: '#b3dbb3', 300: '#7fc07f', 400: '#5aa55a', 500: '#3C7939', 600: '#2f6130', 700: '#254d26', 800: '#1c3a1d', 900: '#142914' }
                }
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-50" x-data="volunteerApp()" x-init="init()" x-cloak>

    <!-- Filter bar -->
    <div class="bg-white border-b border-gray-200" x-data="{ showMore: false }">
        <div class="flex items-center gap-2 flex-nowrap px-6 py-2.5">
            <span class="text-xs text-gray-600 mr-1 shrink-0" x-text="filtered.length + ' volunteers'"></span>
            <!-- Search -->
            <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="search" x-model="search" @input.debounce.300ms="applyFilter()" placeholder="Search..."
                       class="pl-8 pr-3 py-1.5 border border-gray-200 rounded-md text-xs w-48 focus:ring-1 focus:ring-pines-500 focus:border-pines-500 placeholder-gray-400">
            </div>
            <!-- All filter pills (behind + Filter) -->
            <template x-if="showMore || typeFilter.length || statusFilter.length">
                <div class="contents">
                    <!-- Type pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="typeFilter.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="filterLabel(typeFilter, 'type', 'types')"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto">
                            <template x-for="t in availableTypes" :key="t">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="typeFilter.includes(t)"
                                           @change="toggleFilter('typeFilter', t)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="t"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Status pill (multi-select) -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border transition-colors"
                                :class="statusFilter.length ? 'border-pines-200 bg-pines-50 text-gray-900' : 'border-gray-200 text-gray-900 hover:bg-gray-50'">
                            <span x-text="statusLabel()"></span>
                            <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-transition class="absolute z-20 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg py-1">
                            <template x-for="st in [{val:'sent',label:'Sent'},{val:'needs',label:'Needs Email'}]" :key="st.val">
                                <label class="flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-xs">
                                    <input type="checkbox" :checked="statusFilter.includes(st.val)"
                                           @change="toggleFilter('statusFilter', st.val)"
                                           class="rounded border-gray-300 text-pines-500 focus:ring-pines-500 mr-2 w-3.5 h-3.5">
                                    <span x-text="st.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- Collapse filters -->
                    <button x-show="showMore && !typeFilter.length && !statusFilter.length"
                            @click="showMore = false"
                            class="text-xs text-gray-400 hover:text-gray-600 px-1 py-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </template>
            <!-- + Filter toggle -->
            <button x-show="!showMore && !typeFilter.length && !statusFilter.length"
                    @click="showMore = true"
                    class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-medium border border-dashed border-gray-300 text-gray-400 hover:text-gray-600 hover:border-gray-400 transition-colors">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Filter
            </button>
            <!-- Clear -->
            <button x-show="search || typeFilter.length || statusFilter.length"
                    @click="clearFilters()" class="text-xs text-gray-400 hover:text-gray-600 px-1.5 py-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <!-- Spacer + actions -->
            <div class="ml-auto flex items-center gap-2">
                <a href="/sportsengine" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                    Sync
                </a>
            </div>
        </div>
    </div>

    <main class="bg-white px-6 pt-4">
        <div x-show="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-pines-500"></div>
            <p class="mt-2 text-gray-600">Loading volunteers...</p>
        </div>

        <div x-show="!loading">
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th x-show="ecv('name')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Name</th>
                            <th x-show="ecv('email')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Email</th>
                            <th x-show="ecv('registration_type')" class="px-4 py-2.5 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Registration Type</th>
                            <th x-show="ecv('status')" class="px-4 py-2.5 text-center text-xs font-semibold text-gray-900 uppercase tracking-wider whitespace-nowrap">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="vol in filtered" :key="vol.id">
                            <tr class="hover:bg-gray-50 cursor-pointer transition-colors border-b border-gray-100" @click="openPanel(vol)">
                                <td x-show="ecv('name')" class="px-4 py-3 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900" x-text="vol.name"></div>
                                </td>
                                <td x-show="ecv('email')" class="px-4 py-3 whitespace-nowrap"><div class="text-sm text-gray-900" x-text="vol.email"></div></td>
                                <td x-show="ecv('registration_type')" class="px-4 py-3 whitespace-nowrap">
                                    <div class="flex flex-nowrap gap-1">
                                        <template x-for="reg in filteredRegistrations(vol.registrations)" :key="reg.id">
                                            <span class="inline-flex items-center px-2 py-0.5 text-xs rounded text-gray-700 bg-gray-100" x-text="reg.division"></span>
                                        </template>
                                    </div>
                                </td>
                                <td x-show="ecv('status')" class="px-4 py-3 text-center whitespace-nowrap">
                                    <span x-show="!vol.emailSent" class="text-xs text-orange-600">Needs Email</span>
                                    <span x-show="vol.emailSent" class="text-xs text-green-600">&#10003; Sent</span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div x-show="filtered.length === 0 && !loading" class="text-center py-12">
                <div class="text-gray-400 text-5xl mb-3">&#128587;</div>
                <h3 class="text-lg font-medium text-gray-900 mb-1">No volunteers found</h3>
                <p class="text-gray-500">Try adjusting your filters</p>
            </div>
        </div>
    </main>

    <!-- Detail Side Panel -->
    <div x-show="panelOpen" x-cloak class="fixed inset-0 z-30" @click.self="closePanel()">
        <div x-show="panelOpen"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
             class="absolute top-0 right-0 h-full w-full sm:w-96 bg-white border-l border-gray-200 shadow-lg flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 flex-shrink-0">
                <h2 class="text-lg font-semibold text-gray-900 truncate" x-text="selectedVol?.name || 'Volunteer Details'"></h2>
                <button @click="closePanel()" class="p-1 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <template x-if="selectedVol">
            <div class="flex-1 overflow-y-auto px-6 py-5 space-y-5">
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Name</label>
                    <p class="text-sm text-gray-900" x-text="selectedVol.name"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Email</label>
                    <p class="text-sm text-gray-900" x-text="selectedVol.email"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Registrations</label>
                    <div class="space-y-2">
                        <template x-for="reg in selectedVol.registrations" :key="reg.id">
                            <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg">
                                <span class="inline-flex items-center px-2 py-0.5 text-xs rounded text-gray-700 bg-gray-100" x-text="reg.division"></span>
                                <span class="text-xs text-gray-600" x-text="reg.season"></span>
                            </div>
                        </template>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Email Status</label>
                    <span x-show="!selectedVol.emailSent" class="text-xs text-orange-600">Needs Email</span>
                    <span x-show="selectedVol.emailSent" class="text-xs text-green-600">&#10003; Sent</span>
                </div>
            </div>
            </template>
            <template x-if="selectedVol">
            <div class="border-t border-gray-200 px-6 py-4 flex-shrink-0">
                <button @click="moveToPlayers(selectedVol)" class="w-full px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium">Move to Players</button>
            </div>
            </template>
        </div>
    </div>

    <script src="/static/column-config.js"></script>
    <script>
    function volunteerApp() {
        return {
            loading: true,
            panelOpen: false,
            selectedVol: null,
            all: [],
            filtered: [],
            search: '',
            typeFilter: [],
            statusFilter: [],
            availableTypes: [],
            colVis: {},
            _filterColMap: { typeFilter: 'registration_type', statusFilter: 'status' },

            ecv(colId) {
                if (this.colVis[colId]) return true;
                for (var fk in this._filterColMap) {
                    if (this._filterColMap[fk] === colId) {
                        var v = this[fk];
                        if (Array.isArray(v) ? v.length > 0 : !!v) return true;
                    }
                }
                return false;
            },

            async init() {
                this.colVis = window.POSA_COLUMNS.load('volunteers');
                try {
                    const response = await fetch('/api/admin/players?volunteers_only=true');
                    const data = await response.json();
                    this.all = data.players;
                    this.filtered = data.players;
                    const types = new Set();
                    data.players.forEach(v => v.registrations.forEach(r => types.add(r.division)));
                    this.availableTypes = [...types].sort();
                } catch (error) {
                    console.error('Failed to load volunteers:', error);
                }
                this.loading = false;
            },

            toggleFilter(filterKey, value) {
                const arr = this[filterKey];
                const idx = arr.indexOf(value);
                if (idx >= 0) arr.splice(idx, 1);
                else arr.push(value);
                this.applyFilter();
            },

            filterLabel(arr, singular, plural) {
                if (arr.length === 0) return 'All ' + plural;
                if (arr.length === 1) return arr[0];
                return arr.length + ' ' + plural;
            },

            statusLabel() {
                if (this.statusFilter.length === 0) return 'All statuses';
                const map = { sent: 'Sent', needs: 'Needs Email' };
                if (this.statusFilter.length === 1) return map[this.statusFilter[0]] || this.statusFilter[0];
                return this.statusFilter.length + ' statuses';
            },

            filteredRegistrations(regs) {
                if (!regs) return [];
                if (!this.typeFilter.length) return regs;
                return regs.filter(r => this.typeFilter.includes(r.division));
            },

            clearFilters() {
                this.search = '';
                this.typeFilter = [];
                this.statusFilter = [];
                this.applyFilter();
            },

            applyFilter() {
                this.filtered = this.all.filter(vol => {
                    if (this.search) {
                        const s = this.search.toLowerCase();
                        if (!vol.name.toLowerCase().includes(s) && !vol.email.toLowerCase().includes(s)) return false;
                    }
                    if (this.typeFilter.length > 0) {
                        if (!vol.registrations.some(r => this.typeFilter.includes(r.division))) return false;
                    }
                    if (this.statusFilter.length > 0) {
                        const matchesSent = vol.emailSent;
                        const matchesNeeds = !vol.emailSent;
                        const ok = this.statusFilter.some(s => (s === 'sent' && matchesSent) || (s === 'needs' && matchesNeeds));
                        if (!ok) return false;
                    }
                    return true;
                });
            },

            openPanel(vol) {
                this.selectedVol = { ...vol };
                this.panelOpen = true;
            },

            closePanel() {
                this.panelOpen = false;
                this.selectedVol = null;
            },

            async moveToPlayers(vol) {
                if (!confirm(`Move ${vol.name} to the Players list?`)) return;
                try {
                    const response = await fetch(`/api/players/${vol.id}/set-volunteer`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ is_volunteer: false })
                    });
                    const data = await response.json();
                    if (data.success) {
                        this.all = this.all.filter(v => v.id !== vol.id);
                        this.applyFilter();
                    } else {
                        alert('Failed: ' + (data.error || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Failed:', error);
                    alert('Failed to move to players');
                }
            }
        }
    }
    </script>
    <script src="/static/sidebar.js"></script>
</body>
</html>
